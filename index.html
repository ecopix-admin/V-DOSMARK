<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IndieStream | Global Music Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }
        body {
            background-color: #0b0f19;
            color: #f3f4f6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            padding-bottom: 120px; /* Sabit pleyer üçün boşluq */
        }
        .container {
            width: 100%;
            max-width: 700px;
        }
        header {
            text-align: center;
            margin-bottom: 24px;
            padding-top: 10px;
        }
        header h1 {
            font-size: 26px;
            color: #38bdf8;
            margin-bottom: 6px;
        }
        header p {
            color: #9ca3af;
            font-size: 14px;
        }
        /* Playlist Qutuları */
        .playlist {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 24px;
        }
        .track-card {
            background: #111827;
            border: 1px solid #1f2937;
            padding: 12px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .track-card:hover {
            border-color: #38bdf8;
            background: #1f2937;
        }
        .track-card.active {
            border-color: #38bdf8;
            background: #1e293b;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.15);
        }
        .track-cover {
            width: 60px;
            height: 60px;
            border-radius: 8px;
            object-fit: cover;
        }
        .track-info {
            flex-grow: 1;
        }
        .track-title {
            font-size: 16px;
            font-weight: 600;
            color: #f9fafb;
            margin-bottom: 4px;
        }
        .track-artist {
            font-size: 13px;
            color: #9ca3af;
        }
        .play-indicator {
            font-size: 20px;
            color: #38bdf8;
        }
        /* Sabit Aşağı Pleyer (Floating Embed Player) */
        .floating-player {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(17, 24, 39, 0.95);
            backdrop-filter: blur(10px);
            border-top: 1px solid #374151;
            padding: 12px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 -10px 25px rgba(0,0,0,0.5);
            z-index: 1000;
        }
        .player-content {
            width: 100%;
            max-width: 700px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
        }
        .current-playing-info {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 200px;
        }
        .current-cover {
            width: 45px;
            height: 45px;
            border-radius: 6px;
            object-fit: cover;
        }
        .current-text .title {
            font-size: 14px;
            font-weight: 600;
            color: #fff;
            max-width: 150px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .current-text .artist {
            font-size: 12px;
            color: #9ca3af;
        }
        /* İdarəetmə Düymələri */
        .player-controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-grow: 1;
            max-width: 400px;
        }
        .control-buttons {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 6px;
        }
        .btn {
            background: none;
            border: none;
            color: #9ca3af;
            font-size: 18px;
            cursor: pointer;
            transition: color 0.2s;
        }
        .btn:hover { color: #38bdf8; }
        .btn-main {
            background: #38bdf8;
            color: #0b0f19;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: bold;
        }
        .btn-main:hover { background: #0ea5e9; color: #fff; }
        .btn.active-mode { color: #38bdf8; text-shadow: 0 0 8px rgba(56,189,248,0.5); }
        
        /* Proqres Xətti */
        .progress-container {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 11px;
            color: #9ca3af;
        }
        .progress-bar {
            flex-grow: 1;
            height: 4px;
            background: #374151;
            border-radius: 2px;
            cursor: pointer;
            position: relative;
        }
        .progress-filled {
            height: 100%;
            background: #38bdf8;
            border-radius: 2px;
            width: 0%;
        }
        /* Paylaş və Donasiya */
        .extra-actions {
            display: flex;
            gap: 10px;
        }
        .action-btn {
            background: #1f2937;
            color: #f3f4f6;
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .action-btn:hover { background: #374151; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>IndieStream</h1>
            <p>Independent Music & AI Track Hub</p>
        </header>

        <!-- Mahnı siyahısı (Şəkillərlə) -->
        <div class="playlist" id="playlist">
            <!-- 1-ci Mahnı -->
            <div class="track-card active" data-index="0" data-src="https://www.w3schools.com/html/horse.mp3" data-title="Phantom in the City" data-artist="AI Trap Project" data-cover="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=150">
                <img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=150" class="track-cover" alt="Cover">
                <div class="track-info">
                    <div class="track-title">Phantom in the City</div>
                    <div class="track-artist">AI Trap Project</div>
                </div>
                <div class="play-indicator">▶</div>
            </div>

            <!-- 2-ci Mahnı -->
            <div class="track-card" data-index="1" data-src="https://www.w3schools.com/html/mov_bbb.mp4" data-title="Midnight Energy" data-artist="Cyber Sound" data-cover="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=150">
                <img src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=150" class="track-cover" alt="Cover">
                <div class="track-info">
                    <div class="track-title">Midnight Energy</div>
                    <div class="track-artist">Cyber Sound</div>
                </div>
                <div class="play-indicator">🎵</div>
            </div>
        </div>
    </div>

    <!-- Sabit Pleyer (Arxa fonda və ekrandan çıxanda işləməyə davam edir) -->
    <div class="floating-player">
        <div class="player-content">
            <div class="current-playing-info">
                <img id="currentCover" src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=150" class="current-cover" alt="Cover">
                <div class="current-text">
                    <div class="title" id="currentTitle">Phantom in the City</div>
                    <div class="artist" id="currentArtist">AI Trap Project</div>
                </div>
            </div>

            <div class="player-controls">
                <div class="control-buttons">
                    <button class="btn" id="repeatBtn" title="Təkrar oxut">🔁</button>
                    <button class="btn" id="prevBtn" title="Əvvəlki">⏮</button>
                    <button class="btn btn-main" id="playPauseBtn">▶</button>
                    <button class="btn" id="nextBtn" title="Növbəti">⏭</button>
                    <button class="btn" id="shareBtn" title="Paylaş">🔗</button>
                </div>
                <div class="progress-container">
                    <span id="currentTime">0:00</span>
                    <div class="progress-bar" id="progressBar">
                        <div class="progress-filled" id="progressFilled"></div>
                    </div>
                    <span id="duration">0:00</span>
                </div>
            </div>

            <div class="extra-actions">
                <a href="https://www.buymeacoffee.com" target="_blank" class="action-btn">☕ Dəstək</a>
            </div>
        </div>
    </div>

    <!-- Gizli audio elementi -->
    <audio id="audioPlayer"></audio>

    <script>
        const audio = document.getElementById('audioPlayer');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const repeatBtn = document.getElementById('repeatBtn');
        const shareBtn = document.getElementById('shareBtn');
        const trackCards = document.querySelectorAll('.track-card');
        
        const currentTitle = document.getElementById('currentTitle');
        const currentArtist = document.getElementById('currentArtist');
        const currentCover = document.getElementById('currentCover');
        
        const progressBar = document.getElementById('progressBar');
        const progressFilled = document.getElementById('progressFilled');
        const currentTimeEl = document.getElementById('currentTime');
        const durationEl = document.getElementById('duration');

        let currentIndex = 0;
        let isPlaying = false;
        let isRepeat = false;

        // Mahnı yükləmək və oxutmaq funksiyası
        function loadTrack(index) {
            trackCards.forEach(c => c.classList.remove('active'));
            const selectedCard = trackCards[index];
            selectedCard.classList.add('active');

            const src = selectedCard.getAttribute('data-src');
            const title = selectedCard.getAttribute('data-title');
            const artist = selectedCard.getAttribute('data-artist');
            const cover = selectedCard.getAttribute('data-cover');

            audio.src = src;
            currentTitle.innerText = title;
            currentArtist.innerText = artist;
            currentCover.src = cover;
            currentIndex = index;
        }

        function playTrack() {
            audio.play();
            isPlaying = true;
            playPauseBtn.innerText = '⏸';
        }

        function pauseTrack() {
            audio.pause();
            isPlaying = false;
            playPauseBtn.innerText = '▶';
        }

        playPauseBtn.addEventListener('click', () => {
            if (isPlaying) {
                pauseTrack();
            } else {
                playTrack();
            }
        });

        trackCards.forEach((card, index) => {
            card.addEventListener('click', () => {
                loadTrack(index);
                playTrack();
            });
        });

        nextBtn.addEventListener('click', () => {
            currentIndex = (currentIndex + 1) % trackCards.length;
            loadTrack(currentIndex);
            playTrack();
        });

        prevBtn.addEventListener('click', () => {
            currentIndex = (currentIndex - 1 + trackCards.length) % trackCards.length;
            loadTrack(currentIndex);
            playTrack();
        });

        repeatBtn.addEventListener('click', () => {
            isRepeat = !isRepeat;
            repeatBtn.classList.toggle('active-mode', isRepeat);
        });

        // Avtomatik növbəti mahnıya keçid və təkrar rejimi
        audio.addEventListener('ended', () => {
            if (isRepeat) {
                audio.play();
            } else {
                nextBtn.click();
            }
        });

        // Proqram xətti və vaxt izləmə
        audio.addEventListener('timeupdate', () => {
            if (audio.duration) {
                const percent = (audio.currentTime / audio.duration) * 100;
                progressFilled.style.width = `${percent}%`;

                currentTimeEl.innerText = formatTime(audio.currentTime);
                durationEl.innerText = formatTime(audio.duration);
            }
        });

        progressBar.addEventListener('click', (e) => {
            const width = progressBar.clientWidth;
            const clickX = e.offsetX;
            audio.currentTime = (clickX / width) * audio.duration;
        });

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        // Paylaş düyməsi (Link kopyalama)
        shareBtn.addEventListener('click', () => {
            navigator.clipboard.writeText(window.location.href);
            alert('Platforma linki kopyalandı! Dostlarınla paylaşa bilərsən.');
        });

        // İlk mahnını yüklə (Avtomatik başlatmır, istifadəçi klikləməlidir)
        loadTrack(0);
    </script>
</body>
</html>
