<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Indie Beats | Music Hub</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background: #1e293b;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            margin-top: 20px;
        }
        header {
            text-align: center;
            margin-bottom: 24px;
        }
        header h1 {
            font-size: 24px;
            color: #38bdf8;
            margin-bottom: 8px;
        }
        header p {
            color: #94a3b8;
            font-size: 14px;
        }
        .playlist {
            list-style: none;
            margin-bottom: 24px;
        }
        .playlist li {
            padding: 12px 16px;
            background: #0f172a;
            margin-bottom: 8px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.2s;
        }
        .playlist li:hover {
            background: #334155;
        }
        .playlist li.active {
            border-left: 4px solid #38bdf8;
            background: #1e293b;
        }
        .player-box {
            background: #0f172a;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
        }
        .now-playing {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 12px;
            color: #e2e8f0;
        }
        audio {
            width: 100%;
            outline: none;
            margin-bottom: 16px;
        }
        .donate-section {
            text-align: center;
            margin-top: 24px;
        }
        .donate-btn {
            display: inline-block;
            background-color: #ffdd00;
            color: #000;
            font-weight: 700;
            padding: 12px 24px;
            border-radius: 30px;
            text-decoration: none;
            box-shadow: 0 4px 12px rgba(255, 221, 0, 0.3);
            transition: transform 0.2s;
        }
        .donate-btn:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Global Indie Beats</h1>
            <p>Exclusive AI & Trap-Rap Sound Hub</p>
        </header>

        <!-- Musiqi Siyahısı -->
        <ul class="playlist" id="playlist">
            <li data-src="https://www.w3schools.com/html/horse.mp3" class="active">
                <span>1. Phantom in the City (Remix)</span>
                <span>🎵</span>
            </li>
            <li data-src="https://www.w3schools.com/html/mov_bbb.mp4">
                <span>2. Midnight Energy (Instrumental)</span>
                <span>🎵</span>
            </li>
        </ul>

        <!-- Pleyer Bölməsi -->
        <div class="player-box">
            <div class="now-playing" id="nowPlaying">Selected: Phantom in the City (Remix)</div>
            <audio id="audioPlayer" controls autoplay>
                <source src="https://www.w3schools.com/html/horse.mp3" type="audio/mpeg">
                Your browser does not support the audio element.
            </audio>
        </div>

        <!-- Donasiya Düyməsi (Buy Me a Coffee) -->
        <div class="donate-section">
            <a href="https://www.buymeacoffee.com" target="_blank" class="donate-btn">☕ Buy Me a Coffee</a>
        </div>
    </div>

    <script>
        const audioPlayer = document.getElementById('audioPlayer');
        const playlistItems = document.querySelectorAll('#playlist li');
        const nowPlaying = document.getElementById('nowPlaying');

        playlistItems.forEach(item => {
            item.addEventListener('click', () => {
                // Aktiv sinfi dəyiş
                playlistItems.forEach(i => i.classList.remove('active'));
                item.classList.add('active');

                // Yeni mahnı linkini yüklə və çal
                const src = item.getAttribute('data-src');
                const title = item.querySelector('span').innerText;
                
                audioPlayer.src = src;
                nowPlaying.innerText = `Selected: ${title}`;
                audioPlayer.play();
            });
        });
    </script>

</body>
</html>
