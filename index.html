
<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10131b">
<title>LinguaLink — World Chat</title>
<script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>
<style>
*{box-sizing:border-box}
:root{color-scheme:dark;--bg:#10131b;--panel:#191f2b;--line:#303849;--accent:#7969f7;--green:#45d9ad;--muted:#9ba7bb}
body{margin:0;background:var(--bg);color:#f5f6fc;font:15px system-ui,Arial,sans-serif}
button,input,select,textarea{font:inherit}
button{border:0;cursor:pointer;border-radius:12px;background:var(--accent);color:white;padding:12px;font-weight:650}
button:disabled{opacity:.45}
input,select,textarea{width:100%;min-width:0;background:#111722;color:white;border:1px solid var(--line);border-radius:11px;padding:12px;outline:none}
.app{max-width:760px;height:100dvh;margin:auto;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:11px;padding:15px;border-bottom:1px solid var(--line)}
.logo{width:43px;height:43px;display:grid;place-items:center;border-radius:14px;background:linear-gradient(135deg,#8b75ff,#45d9ad);color:#111722;font-size:23px;font-weight:900}
.brand{font-size:19px;font-weight:850}.sub,.small{font-size:12px;color:var(--muted)}
.status{margin-left:auto;font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:#e5ac4e}.dot.on{background:var(--green)}
.setup{padding:12px;border-bottom:1px solid var(--line);display:grid;gap:9px}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}
#myId{color:var(--green);font-size:12px;overflow-wrap:anywhere}
#copy{flex:0 0 auto}
.languages{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.languages label{font-size:11px;color:var(--muted)}
.languages select{margin-top:5px}
#chat{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:11px;padding:14px}
.welcome{text-align:center;margin:auto 12px;line-height:1.8;color:var(--muted);font-size:13px}
.msg{max-width:88%;align-self:flex-start;padding:11px 13px;border-radius:15px;background:#202735;overflow-wrap:anywhere;white-space:pre-wrap}
.msg.mine{align-self:flex-end;background:#383166}
.who{font-size:10px;color:#c4baff;margin-bottom:5px}
.translation{border-top:1px solid #ffffff25;margin-top:8px;padding-top:8px;color:#9df0d4}
.time{font-size:10px;color:#aeb8c9;text-align:right;margin-top:7px}
audio{display:block;width:100%;max-width:260px;margin-top:8px}
.tools{display:flex;gap:7px;padding:8px 11px;overflow-x:auto}
.tools button{white-space:nowrap;background:#252d3c;font-size:12px;padding:9px 11px}
.composer{display:flex;align-items:flex-end;gap:8px;padding:8px 11px}
#message{flex:1;resize:none;max-height:100px;min-height:45px}
.icon{width:46px;height:46px;flex-shrink:0;padding:8px;font-size:19px}
#record.rec{background:#e54864}
footer{text-align:center;color:#78849a;font-size:10px;padding:3px 8px calc(8px + env(safe-area-inset-bottom))}
#toast{display:none;position:fixed;z-index:10;bottom:90px;left:50%;transform:translateX(-50%);background:#343d50;color:white;padding:12px 15px;border-radius:12px;width:max-content;max-width:90%;font-size:13px}
@media(min-width:600px){.setup{padding:15px 22px}#chat{padding:20px}.composer{padding:10px 20px}}
</style>
</head>
<body>
<div class="app">
<header>
 <div class="logo">文</div>
 <div><div class="brand">LinguaLink</div><div class="sub">Translate as you chat</div></div>
 <div class="status"><span class="dot" id="dot"></span><span id="status">Hazırlanır...</span></div>
</header>

<section class="setup">
 <div class="small">SƏNİN ID-N</div>
 <div class="row"><div id="myId">Serverə qoşulur...</div><button id="copy">Kopyala</button></div>
 <div class="row">
  <input id="remote" placeholder="Dostunun ID-si">
  <button id="connect" style="flex:0 0 auto">Qoşul</button>
 </div>
 <div class="languages">
  <label>Sənin danışdığın dil
   <select id="source">
    <option value="az">Azərbaycan dili</option>
    <option value="en">English</option>
    <option value="ru">Русский</option>
    <option value="tr">Türkçe</option>
    <option value="de">Deutsch</option>
    <option value="fr">Français</option>
    <option value="es">Español</option>
    <option value="it">Italiano</option>
    <option value="pt">Português</option>
    <option value="ar">العربية</option>
    <option value="zh-CN">中文</option>
    <option value="hi">हिन्दी</option>
   </select>
  </label>
  <label>Dostunun dili
   <select id="target">
    <option value="de">Deutsch</option>
    <option value="az">Azərbaycan dili</option>
    <option value="en">English</option>
    <option value="ru">Русский</option>
    <option value="tr">Türkçe</option>
    <option value="fr">Français</option>
    <option value="es">Español</option>
    <option value="it">Italiano</option>
    <option value="pt">Português</option>
    <option value="ar">العربية</option>
    <option value="zh-CN">中文</option>
    <option value="hi">हिन्दी</option>
   </select>
  </label>
 </div>
 <div class="small">Hər iki şəxs öz ID-sini paylaşmalıdır. Dostun öz dilini seçsin.</div>
</section>

<main id="chat">
 <div class="welcome">🌍 <b>Dil maneəsi olmasın.</b><br>Qoşulmaq üçün dostunun ID-sini daxil et.<br>Mesaj yaz və ya səsli mesaj göndər.</div>
</main>

<div class="tools">
 <button id="toggle">🌐 Tərcümə aktivdir</button>
 <button id="dictate">🎙 Nitqi mətnə çevir</button>
 <button id="clear">Söhbəti sil</button>
</div>
<div class="composer">
 <button id="record" class="icon" title="Səsli mesaj">🎤</button>
 <textarea id="message" rows="1" placeholder="Mesaj yaz..."></textarea>
 <button id="send" class="icon" title="Göndər">➤</button>
</div>
<footer>WebRTC · PeerJS · Mətn və səsli mesaj</footer>
</div>
<div id="toast"></div>

<script>
(()=>{
"use strict";
const $=id=>document.getElementById(id);
const chat=$("chat");
let peer=null,conn=null,translateOn=true;
let recorder=null,mic=null,isRecording=false,recognition=null;
let transcript="",voiceBuffer={};

const langNames={
 az:"Azərbaycan",en:"English",ru:"Русский",tr:"Türkçe",
 de:"Deutsch",fr:"Français",es:"Español",it:"Italiano",
 pt:"Português",ar:"العربية","zh-CN":"中文",hi:"हिन्दी"
};
const speechCodes={
 az:"az-AZ",en:"en-US",ru:"ru-RU",tr:"tr-TR",
 de:"de-DE",fr:"fr-FR",es:"es-ES",it:"it-IT",
 pt:"pt-PT",ar:"ar-SA","zh-CN":"zh-CN",hi:"hi-IN"
};
function toast(s){
 const el=$("toast");el.textContent=s;el.style.display="block";
 clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.style.display="none",3500);
}
function status(s,on=false){
 $("status").textContent=s;$("dot").classList.toggle("on",on);
}
function connected(){return !!conn&&conn.open}
function now(){return new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})}
function addMsg({text="",translated="",audio="",mine=false,label=""}){
 chat.querySelector(".welcome")?.remove();
 const b=document.createElement("div");b.className="msg"+(mine?" mine":"");
 const who=document.createElement("div");who.className="who";
 who.textContent=label||(mine?"Sən":"Dostun");b.appendChild(who);
 if(text){const t=document.createElement("div");t.textContent=text;b.appendChild(t)}
 if(translated){const t=document.createElement("div");t.className="translation";t.textContent="🌐 "+translated;b.appendChild(t)}
 if(audio){const a=document.createElement("audio");a.controls=true;a.src=audio;b.appendChild(a)}
 const tm=document.createElement("div");tm.className="time";tm.textContent=now();b.appendChild(tm);
 chat.appendChild(b);chat.scrollTop=chat.scrollHeight;
}
function sendPacket(p){
 if(!connected()){toast("Dostunla əlaqə yoxdur.");return false}
 try{conn.send(p);return true}catch(e){toast("Göndərmə xətası.");return false}
}

/* Translate with MyMemory's translation endpoint.
   The service can impose limits and may not support every language pair. */
async function translate(text,from,to){
 if(!translateOn||!text||!from||!to||from===to)return "";
 try{
  const url="https://api.mymemory.translated.net/get?q="+
    encodeURIComponent(text.slice(0,450))+"&langpair="+
    encodeURIComponent(from+"|"+to);
  const r=await fetch(url);
  if(!r.ok)throw Error("HTTP "+r.status);
  const j=await r.json();
  if(j.responseStatus!==200)throw Error(j.responseDetails||"Tərcümə xidməti xətası");
  const result=String(j.responseData?.translatedText||"").trim();
  if(!result||result.toLowerCase()===text.toLowerCase())return "";
  return result;
 }catch(e){
  console.warn("Translation error",e);
  toast("Tərcümə xidməti cavab vermədi. Orijinal mesaj saxlanıldı.");
  return "";
 }
}
async function sendText(){
 const input=$("message"),text=input.value.trim();
 if(!text)return;
 if(!connected())return toast("Əvvəlcə dostuna qoşul.");
 input.value="";input.style.height="45px";
 addMsg({text,mine:true});
 const from=$("source").value,to=$("target").value;
 sendPacket({type:"text",text,from});
 if(translateOn){
  const tr=await translate(text,from,to);
  if(tr)addMsg({translated:tr,mine:true,label:"Tərcümə"});
 }
}
async function receive(p){
 if(!p||typeof p!=="object")return;
 if(p.type==="text"){
  if(typeof p.text!=="string")return;
  const tr=await translate(p.text,p.from||"en",$("source").value);
  addMsg({text:p.text,translated:tr});
  return;
 }
 if(p.type==="voice-start"){
  voiceBuffer[p.id]={
   parts:new Array(p.total),received:0,total:p.total,
   mime:p.mime||"audio/webm"
  };
  return;
 }
 if(p.type==="voice-chunk"){
  const v=voiceBuffer[p.id];
  if(!v||!Number.isInteger(p.index)||p.index<0||p.index>=v.total)return;
  if(!v.parts[p.index]){
   v.parts[p.index]=p.chunk;v.received++;
  }
  if(v.received===v.total){
   try{
    const bytes=v.parts.map(s=>{
     const bin=atob(s),arr=new Uint8Array(bin.length);
     for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);
     return arr;
    });
    const blob=new Blob(bytes,{type:v.mime});
    v.url=URL.createObjectURL(blob);
    v.ready=true;
    if(v.transcript){
     const tr=await translate(v.transcript,v.from||"en",$("source").value);
     addMsg({text:"🎙 "+v.transcript,translated:tr});
    }
    addMsg({audio:v.url,label:"Səsli mesaj"});
   }catch(e){toast("Səsli mesaj açıla bilmədi.");console.error(e)}
  }
  return;
 }
 if(p.type==="voice-text"){
  const v=voiceBuffer[p.id];
  if(v){v.transcript=p.text;v.from=p.from;if(v.ready){
   const tr=await translate(p.text,p.from||"en",$("source").value);
   addMsg({text:"🎙 "+p.text,translated:tr});
  }}
 }
}
function bind(c){
 conn=c;
 c.on("open",()=>{
  status("Birbaşa əlaqə aktivdir",true);
  $("connect").textContent="Bağlandı";
  toast("P2P əlaqə quruldu.");
 });
 c.on("data",receive);
 c.on("close",()=>{
  if(conn===c){conn=null;status("Əlaqə kəsildi");$("connect").textContent="Qoşul"}
 });
 c.on("error",e=>{console.error(e);toast("WebRTC bağlantı xətası.")});
}
function init(){
 if(!window.Peer){status("PeerJS yüklənmədi");return toast("İnterneti yoxla və səhifəni yenilə.")}
 peer=new Peer(undefined,{debug:1});
 peer.on("open",id=>{$("myId").textContent=id;status("ID hazırdır")});
 peer.on("connection",bind);
 peer.on("disconnected",()=>status("Siqnallaşdırma əlaqəsi kəsildi"));
 peer.on("error",e=>{
  console.error(e);status("Qoşulma xətası");
  toast(e.type==="peer-unavailable"?"Dostun onlayn deyil və ya ID səhvdir.":"PeerJS: "+e.type);
 });
}
$("connect").onclick=()=>{
 const id=$("remote").value.trim();
 if(!id)return toast("Dostunun ID-sini yaz.");
 if(!peer||peer.destroyed)return toast("ID hazırlanmasını gözlə.");
 if(id===$("myId").textContent)return toast("Öz ID-nə qoşula bilməzsən.");
 try{bind(peer.connect(id,{reliable:true,serialization:"json"}));status("Qoşulur...")}
 catch(e){toast("Qoşulmaq mümkün olmadı.")}
};
$("copy").onclick=async()=>{
 const id=$("myId").textContent;
 if(!id||id.includes("..."))return toast("ID hələ hazır deyil.");
 try{await navigator.clipboard.writeText(id);toast("ID kopyalandı.")}
 catch(e){toast("ID-ni basıb saxlayaraq kopyala: "+id)}
};
$("send").onclick=sendText;
$("message").addEventListener("keydown",e=>{
 if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendText()}
});
$("message").addEventListener("input",e=>{
 e.target.style.height="45px";
 e.target.style.height=Math.min(e.target.scrollHeight,100)+"px";
});
$("toggle").onclick=()=>{
 translateOn=!translateOn;
 $("toggle").textContent="🌐 Tərcümə "+(translateOn?"aktivdir":"sönülüdür");
};
$("clear").onclick=()=>{
 if(confirm("Söhbət ekranını təmizləyək?"))chat.innerHTML="";
};
function speechConstructor(){return window.SpeechRecognition||window.webkitSpeechRecognition}
function startRecognition(){
 const SR=speechConstructor();
 if(!SR)return false;
 try{
  recognition=new SR();
  recognition.lang=speechCodes[$("source").value]||"en-US";
  recognition.continuous=true;
  recognition.interimResults=true;
  recognition.onresult=e=>{
   let finalText="";
   for(let i=e.resultIndex;i<e.results.length;i++){
    if(e.results[i].isFinal)finalText+=e.results[i][0].transcript+" ";
   }
   transcript+=(finalText||"");
  };
  recognition.onerror=e=>console.warn("Speech recognition:",e.error);
  recognition.start();
  return true;
 }catch(e){console.warn(e);recognition=null;return false}
}
$("dictate").onclick=()=>{
 const SR=speechConstructor();
 if(!SR)return toast("Bu brauzer nitqin tanınmasını dəstəkləmir. Chrome-da yoxla.");
 try{
  const r=new SR();r.lang=speechCodes[$("source").value]||"en-US";
  r.interimResults=false;r.maxAlternatives=1;
  r.onresult=e=>{$("message").value+=($("message").value?" ":"")+e.results[0][0].transcript};
  r.onerror=()=>toast("Nitq tanınmadı. Mikrofon və dil parametrlərini yoxla.");
  r.start();toast("İndi danış...");
 }catch(e){toast("Nitq tanıma açıla bilmədi.")}
};
function b64(bytes){
 let s="";
 for(let i=0;i<bytes.length;i+=8192)
  s+=String.fromCharCode(...bytes.subarray(i,Math.min(i+8192,bytes.length)));
 return btoa(s);
}
async function finishVoice(parts,mime,txt,from){
 try{
  const blob=new Blob(parts,{type:mime||"audio/webm"});
  if(blob.size>2*1024*1024)return toast("Səs 2 MB-dan böyükdür. Daha qısa yaz.");
  const bytes=new Uint8Array(await blob.arrayBuffer());
  const id=Date.now().toString(36)+Math.random().toString(36).slice(2,7);
  const size=8000,total=Math.ceil(bytes.length/size);
  if(!sendPacket({type:"voice-start",id,total,mime:blob.type}))return;
  for(let i=0;i<total;i++){
   if(!sendPacket({type:"voice-chunk",id,index:i,chunk:b64(bytes.subarray(i*size,Math.min(bytes.length,(i+1)*size)))}))return;
  }
  if(txt)sendPacket({type:"voice-text",id,text:txt,from});
  addMsg({audio:URL.createObjectURL(blob),mine:true,label:"Sənin səsli mesajın"});
  if(txt){
   const tr=await translate(txt,from,$("target").value);
   if(tr)addMsg({text:"🎙 "+txt,translated:tr,mine:true,label:"Səsin tərcüməsi"});
  }else{
   toast("Səs göndərildi. Nitq tanınmadığı üçün tərcümə mətni alınmadı.");
  }
 }catch(e){console.error(e);toast("Səsli mesaj göndərilə bilmədi.")}
}
$("record").onclick=async()=>{
 if(isRecording){recorder?.stop();return}
 if(!connected())return toast("Əvvəlcə dostunla əlaqə yarat.");
 if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder)
  return toast("Bu brauzer səs yazmağı dəstəkləmir.");
 transcript="";
 try{
  mic=await navigator.mediaDevices.getUserMedia({audio:true});
  const mime=["audio/webm;codecs=opus","audio/webm","audio/mp4"].find(t=>MediaRecorder.isTypeSupported(t));
  recorder=new MediaRecorder(mic,mime?{mimeType:mime}:{});
  const parts=[];
  recorder.ondataavailable=e=>{if(e.data.size)parts.push(e.data)};
  const recognized=startRecognition();
  recorder.onstop=()=>{
   isRecording=false;$("record").classList.remove("rec");$("record").textContent="🎤";
   mic?.getTracks().forEach(t=>t.stop());mic=null;
   try{recognition?.stop()}catch(e){}
   const text=transcript.trim(),from=$("source").value;
   setTimeout(()=>finishVoice(parts,recorder.mimeType,text,from),700);
  };
  recorder.start();isRecording=true;
  $("record").classList.add("rec");$("record").textContent="■";
  toast(recognized?"Yazılır. Bitirmək üçün ■ düyməsinə bas.":"Səs yazılır; bu brauzerdə avtomatik nitq tanıma mövcud deyil.");
 }catch(e){
  console.error(e);mic?.getTracks().forEach(t=>t.stop());mic=null;
  toast("Mikrofon icazəsini yoxla.");
 }
};
window.addEventListener("beforeunload",()=>{
 try{mic?.getTracks().forEach(t=>t.stop());peer?.destroy()}catch(e){}
});
init();
})();
</script>
</body>
</html>
