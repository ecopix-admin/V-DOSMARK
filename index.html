<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05070b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>ARWORLD — Real-World Search</title>

<link rel="preconnect" href="https://unpkg.com">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
:root{
 --bg:#05070b;
 --bg2:#0a0e15;
 --panel:#0d131d;
 --panel2:#111925;
 --line:rgba(255,255,255,.09);
 --line2:rgba(255,255,255,.15);
 --text:#f4f7fb;
 --muted:#8c99aa;
 --green:#24e58a;
 --green2:#12b96c;
 --blue:#4da3ff;
 --orange:#ffb347;
 --red:#ff5570;
 --purple:#9c6cff;
 --shadow:0 20px 60px rgba(0,0,0,.45);
 --radius:22px;
}
*{box-sizing:border-box}
html,body{
 margin:0;
 width:100%;
 height:100%;
 background:var(--bg);
 color:var(--text);
 font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
 overflow:hidden;
}
button,input,textarea,select{font:inherit}
button{border:0}
#app{
 width:100%;
 height:100%;
 position:relative;
 overflow:hidden;
 background:
 radial-gradient(circle at 20% 10%,rgba(36,229,138,.08),transparent 35%),
 radial-gradient(circle at 90% 30%,rgba(77,163,255,.08),transparent 35%),
 var(--bg);
}

/* MAP */
#map{
 position:absolute;
 inset:0;
 z-index:1;
 background:#080c12;
}
.leaflet-container{
 background:#080c12;
 font-family:inherit;
}
.leaflet-control-zoom{
 border:1px solid var(--line)!important;
 box-shadow:none!important;
}
.leaflet-control-zoom a{
 background:#101722!important;
 color:#fff!important;
 border-color:var(--line)!important;
}
.leaflet-control-attribution{
 background:rgba(5,7,11,.75)!important;
 color:#798596!important;
 font-size:9px;
}
.leaflet-control-attribution a{color:#91bfff}

/* TOP */
.topbar{
 position:absolute;
 top:0;
 left:0;
 right:0;
 z-index:1000;
 padding:calc(10px + env(safe-area-inset-top)) 12px 10px;
 pointer-events:none;
}
.toprow{
 display:flex;
 align-items:center;
 gap:9px;
 pointer-events:auto;
}
.brand{
 display:flex;
 align-items:center;
 gap:8px;
 padding:10px 13px;
 background:rgba(5,8,13,.78);
 border:1px solid var(--line);
 border-radius:16px;
 backdrop-filter:blur(18px);
 box-shadow:0 12px 35px rgba(0,0,0,.25);
}
.logo{
 width:31px;
 height:31px;
 display:grid;
 place-items:center;
 border-radius:10px;
 background:linear-gradient(135deg,var(--green),#0f8bff);
 font-size:17px;
 font-weight:900;
 color:#00130b;
}
.brand strong{
 font-size:14px;
 letter-spacing:.7px;
}
.brand small{
 display:block;
 color:var(--muted);
 font-size:9px;
 margin-top:1px;
}
.searchbox{
 flex:1;
 min-width:0;
 height:49px;
 display:flex;
 align-items:center;
 gap:8px;
 padding:0 13px;
 background:rgba(5,8,13,.82);
 border:1px solid var(--line);
 border-radius:17px;
 backdrop-filter:blur(18px);
}
.searchbox span{font-size:18px}
.searchbox input{
 width:100%;
 border:0;
 outline:0;
 color:#fff;
 background:transparent;
 font-size:14px;
}
.searchbox input::placeholder{color:#6f7b8b}
.iconbtn{
 width:45px;
 height:45px;
 flex:0 0 45px;
 border-radius:15px;
 color:#fff;
 background:rgba(8,12,18,.84);
 border:1px solid var(--line);
 display:grid;
 place-items:center;
 cursor:pointer;
 transition:.2s;
}
.iconbtn:active{transform:scale(.94)}
.iconbtn.green{
 background:rgba(36,229,138,.14);
 border-color:rgba(36,229,138,.35);
 color:var(--green);
}

/* STATUS */
.statusbar{
 position:absolute;
 z-index:900;
 top:77px;
 left:12px;
 right:12px;
 display:flex;
 gap:7px;
 overflow-x:auto;
 scrollbar-width:none;
 pointer-events:none;
}
.statusbar::-webkit-scrollbar{display:none}
.status{
 flex:0 0 auto;
 display:flex;
 align-items:center;
 gap:5px;
 padding:7px 10px;
 border-radius:13px;
 background:rgba(6,9,14,.76);
 border:1px solid var(--line);
 backdrop-filter:blur(14px);
 color:#cbd4df;
 font-size:10px;
}
.dot{
 width:7px;
 height:7px;
 border-radius:50%;
 background:#657080;
}
.dot.on{
 background:var(--green);
 box-shadow:0 0 12px var(--green);
}
.dot.warn{
 background:var(--orange);
 box-shadow:0 0 12px var(--orange);
}

/* MAP CONTROLS */
.maptools{
 position:absolute;
 z-index:800;
 right:12px;
 top:137px;
 display:flex;
 flex-direction:column;
 gap:8px;
}
.maptool{
 width:44px;
 height:44px;
 border-radius:14px;
 background:rgba(7,11,17,.82);
 border:1px solid var(--line);
 color:#fff;
 backdrop-filter:blur(15px);
 display:grid;
 place-items:center;
 cursor:pointer;
 box-shadow:0 8px 25px rgba(0,0,0,.25);
}
.maptool.active{
 color:var(--green);
 border-color:rgba(36,229,138,.35);
 background:rgba(36,229,138,.1);
}

/* RADAR */
.radar{
 position:absolute;
 z-index:500;
 left:50%;
 top:50%;
 transform:translate(-50%,-50%);
 width:260px;
 height:260px;
 border:1px solid rgba(36,229,138,.13);
 border-radius:50%;
 pointer-events:none;
 opacity:.55;
}
.radar:before,
.radar:after{
 content:"";
 position:absolute;
 inset:25%;
 border:1px solid rgba(36,229,138,.10);
 border-radius:50%;
}
.radar:after{
 inset:50%;
}
.crosshair{
 position:absolute;
 left:50%;
 top:50%;
 width:22px;
 height:22px;
 transform:translate(-50%,-50%);
 pointer-events:none;
 z-index:600;
}
.crosshair:before,
.crosshair:after{
 content:"";
 position:absolute;
 background:rgba(255,255,255,.6);
}
.crosshair:before{
 width:22px;
 height:1px;
 left:0;
 top:10px;
}
.crosshair:after{
 width:1px;
 height:22px;
 left:10px;
 top:0;
}

/* BOTTOM */
.bottom{
 position:absolute;
 z-index:1100;
 left:0;
 right:0;
 bottom:0;
 padding:10px 12px calc(10px + env(safe-area-inset-bottom));
 pointer-events:none;
}
.bottomrow{
 display:flex;
 align-items:center;
 justify-content:center;
 gap:10px;
 pointer-events:auto;
}
.navbtn{
 width:58px;
 height:55px;
 border-radius:18px;
 color:#dce4ed;
 background:rgba(7,11,17,.88);
 border:1px solid var(--line);
 backdrop-filter:blur(20px);
 cursor:pointer;
}
.navbtn span{
 display:block;
 font-size:18px;
 line-height:20px;
}
.navbtn small{
 font-size:8px;
 color:#778393;
}
.addbtn{
 width:70px;
 height:70px;
 margin-top:-17px;
 border-radius:24px;
 background:linear-gradient(145deg,var(--green),#12aeff);
 color:#00120a;
 border:3px solid rgba(255,255,255,.16);
 box-shadow:0 12px 35px rgba(36,229,138,.23);
 font-size:30px;
 font-weight:300;
 cursor:pointer;
}
.addbtn:active{transform:scale(.94)}

/* OBJECT CARDS */
.objectLayer{
 position:absolute;
 inset:0;
 z-index:650;
 pointer-events:none;
}
.worldCard{
 position:absolute;
 min-width:190px;
 max-width:270px;
 padding:10px;
 background:rgba(8,12,18,.88);
 border:1px solid var(--line2);
 border-radius:18px;
 backdrop-filter:blur(17px);
 box-shadow:0 16px 40px rgba(0,0,0,.35);
 pointer-events:auto;
 cursor:pointer;
 transform:translate(-50%,-50%);
 animation:appear .25s ease;
}
@keyframes appear{
 from{opacity:0;transform:translate(-50%,-45%) scale(.92)}
 to{opacity:1;transform:translate(-50%,-50%) scale(1)}
}
.worldCard .wcTop{
 display:flex;
 gap:9px;
 align-items:center;
}
.avatar{
 width:39px;
 height:39px;
 flex:0 0 39px;
 border-radius:13px;
 display:grid;
 place-items:center;
 overflow:hidden;
 background:linear-gradient(135deg,#172536,#0b121c);
 border:1px solid var(--line);
 font-size:19px;
}
.avatar img{
 width:100%;
 height:100%;
 object-fit:cover;
}
.wcName{
 font-size:13px;
 font-weight:800;
 white-space:nowrap;
 overflow:hidden;
 text-overflow:ellipsis;
}
.wcType{
 color:var(--green);
 font-size:9px;
 margin-top:2px;
}
.wcDistance{
 margin-left:auto;
 font-size:9px;
 color:#a7b4c3;
}
.wcDesc{
 margin-top:8px;
 font-size:10px;
 color:#a5b1c0;
 line-height:1.4;
}
.wcMedia{
 margin-top:8px;
 height:100px;
 border-radius:13px;
 overflow:hidden;
 background:#05070b;
}
.wcMedia img,
.wcMedia video{
 width:100%;
 height:100%;
 object-fit:cover;
}
.wcBottom{
 margin-top:8px;
 display:flex;
 align-items:center;
 justify-content:space-between;
 color:#728091;
 font-size:9px;
}
.tag{
 padding:4px 7px;
 border-radius:7px;
 background:rgba(255,255,255,.05);
}

/* PANELS */
.overlay{
 position:absolute;
 inset:0;
 z-index:2000;
 background:rgba(0,0,0,.55);
 backdrop-filter:blur(5px);
 display:none;
}
.overlay.show{display:block}
.sheet{
 position:absolute;
 left:0;
 right:0;
 bottom:0;
 max-height:94%;
 background:linear-gradient(180deg,#0d141e,#080c12);
 border-top:1px solid var(--line2);
 border-radius:28px 28px 0 0;
 box-shadow:0 -25px 80px rgba(0,0,0,.55);
 overflow:hidden;
 transform:translateY(100%);
 transition:transform .3s cubic-bezier(.2,.8,.2,1);
}
.overlay.show .sheet{transform:translateY(0)}
.sheetHeader{
 padding:14px 16px 10px;
 display:flex;
 align-items:center;
 justify-content:space-between;
 border-bottom:1px solid var(--line);
}
.handle{
 position:absolute;
 top:7px;
 left:50%;
 transform:translateX(-50%);
 width:42px;
 height:4px;
 border-radius:10px;
 background:#526071;
}
.sheetTitle{
 font-size:16px;
 font-weight:850;
 padding-top:5px;
}
.close{
 width:38px;
 height:38px;
 border-radius:13px;
 background:rgba(255,255,255,.06);
 color:#fff;
 cursor:pointer;
}
.sheetBody{
 padding:15px;
 overflow-y:auto;
 max-height:calc(94vh - 65px);
 padding-bottom:calc(25px + env(safe-area-inset-bottom));
}

/* FORMS */
.field{
 margin-bottom:12px;
}
.field label{
 display:block;
 color:#9aa7b7;
 font-size:10px;
 font-weight:700;
 margin:0 0 6px 3px;
}
.input,
.textarea,
.select{
 width:100%;
 border:1px solid var(--line);
 outline:0;
 color:#fff;
 background:#0a1018;
 border-radius:14px;
 padding:12px 13px;
 font-size:13px;
}
.textarea{
 min-height:90px;
 resize:vertical;
}
.input:focus,
.textarea:focus,
.select:focus{
 border-color:rgba(36,229,138,.45);
}
.row{
 display:flex;
 gap:9px;
}
.row>*{flex:1}
.chips{
 display:flex;
 flex-wrap:wrap;
 gap:7px;
}
.chip{
 padding:9px 11px;
 border-radius:12px;
 color:#a9b4c1;
 background:#0a1018;
 border:1px solid var(--line);
 cursor:pointer;
 font-size:10px;
}
.chip.active{
 color:#06130d;
 background:var(--green);
 border-color:var(--green);
}
.primary{
 width:100%;
 min-height:49px;
 border-radius:15px;
 background:linear-gradient(135deg,var(--green),#0fbdff);
 color:#00140c;
 font-weight:900;
 cursor:pointer;
 box-shadow:0 12px 30px rgba(36,229,138,.14);
}
.secondary{
 width:100%;
 min-height:45px;
 border-radius:14px;
 background:#111a26;
 border:1px solid var(--line);
 color:#dce5ee;
 cursor:pointer;
}
.danger{
 background:rgba(255,85,112,.1);
 color:#ff7d91;
 border-color:rgba(255,85,112,.25);
}
.buttons{
 display:flex;
 gap:9px;
 margin-top:15px;
}
.buttons>*{flex:1}

/* MEDIA */
.mediaActions{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:8px;
}
.mediaBtn{
 min-height:70px;
 border-radius:16px;
 border:1px solid var(--line);
 background:#0a1018;
 color:#dce5ee;
 cursor:pointer;
}
.mediaBtn b{
 display:block;
 font-size:22px;
 margin-bottom:5px;
}
.mediaBtn small{
 font-size:9px;
 color:#7f8c9c;
}
.mediaList{
 display:flex;
 flex-direction:column;
 gap:8px;
 margin-top:10px;
}
.mediaItem{
 display:flex;
 align-items:center;
 gap:10px;
 padding:9px;
 border:1px solid var(--line);
 border-radius:14px;
 background:#0a1018;
}
.mediaThumb{
 width:55px;
 height:55px;
 flex:0 0 55px;
 border-radius:11px;
 overflow:hidden;
 background:#05070b;
 display:grid;
 place-items:center;
}
.mediaThumb img,
.mediaThumb video{
 width:100%;
 height:100%;
 object-fit:cover;
}
.mediaInfo{
 min-width:0;
 flex:1;
}
.mediaName{
 white-space:nowrap;
 overflow:hidden;
 text-overflow:ellipsis;
 font-size:11px;
 font-weight:700;
}
.mediaMeta{
 color:#718091;
 font-size:9px;
 margin-top:3px;
}
.removeMedia{
 width:34px;
 height:34px;
 border-radius:10px;
 background:rgba(255,85,112,.1);
 color:#ff7187;
 cursor:pointer;
}

/* HOME CARDS */
.homePanel{
 position:absolute;
 z-index:700;
 left:12px;
 right:12px;
 bottom:93px;
 max-width:500px;
 margin:auto;
 pointer-events:none;
}
.nearCard{
 padding:14px;
 border-radius:20px;
 background:rgba(6,10,15,.82);
 border:1px solid var(--line);
 backdrop-filter:blur(18px);
 pointer-events:auto;
}
.nearHead{
 display:flex;
 justify-content:space-between;
 align-items:center;
}
.nearHead strong{font-size:13px}
.nearHead span{
 color:var(--green);
 font-size:10px;
}
.nearList{
 display:flex;
 gap:8px;
 margin-top:10px;
 overflow-x:auto;
 scrollbar-width:none;
}
.nearList::-webkit-scrollbar{display:none}
.nearMini{
 min-width:155px;
 padding:10px;
 border-radius:15px;
 background:#0d151f;
 border:1px solid var(--line);
 cursor:pointer;
}
.nearMiniTop{
 display:flex;
 align-items:center;
 gap:8px;
}
.nearMiniName{
 font-size:10px;
 font-weight:800;
 white-space:nowrap;
 overflow:hidden;
 text-overflow:ellipsis;
}
.nearMiniDist{
 color:#748192;
 font-size:8px;
}
.empty{
 padding:16px;
 text-align:center;
 color:#718092;
 font-size:10px;
}

/* CAMERA */
.cameraBox{
 position:absolute;
 inset:0;
 background:#000;
 display:flex;
 flex-direction:column;
}
#cameraVideo{
 width:100%;
 height:100%;
 object-fit:cover;
}
.cameraTop{
 position:absolute;
 top:0;
 left:0;
 right:0;
 padding:calc(12px + env(safe-area-inset-top));
 display:flex;
 justify-content:space-between;
 z-index:5;
}
.cameraBottom{
 position:absolute;
 left:0;
 right:0;
 bottom:0;
 padding:20px 20px calc(25px + env(safe-area-inset-bottom));
 display:flex;
 justify-content:center;
 gap:15px;
 z-index:5;
}
.cameraAction{
 width:62px;
 height:62px;
 border-radius:50%;
 background:rgba(255,255,255,.12);
 border:2px solid rgba(255,255,255,.5);
 color:#fff;
 cursor:pointer;
}
.capture{
 width:75px;
 height:75px;
 border:5px solid #fff;
 background:rgba(255,255,255,.15);
}
.cameraMode{
 position:absolute;
 top:82px;
 left:50%;
 transform:translateX(-50%);
 z-index:5;
 padding:8px 13px;
 border-radius:20px;
 background:rgba(0,0,0,.45);
 color:#fff;
 font-size:10px;
 backdrop-filter:blur(10px);
}

/* DETAIL */
.detailHero{
 display:flex;
 align-items:center;
 gap:12px;
 padding:3px 0 15px;
}
.detailAvatar{
 width:70px;
 height:70px;
 border-radius:22px;
 overflow:hidden;
 background:#111a25;
 display:grid;
 place-items:center;
 font-size:28px;
 border:1px solid var(--line);
}
.detailAvatar img{
 width:100%;
 height:100%;
 object-fit:cover;
}
.detailName{
 font-size:19px;
 font-weight:900;
}
.detailType{
 color:var(--green);
 font-size:10px;
 margin-top:3px;
}
.detailDistance{
 color:#778496;
 font-size:10px;
 margin-top:5px;
}
.detailText{
 color:#b1bdca;
 font-size:12px;
 line-height:1.65;
}
.detailMedia{
 margin-top:13px;
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:7px;
}
.detailMedia>*{
 width:100%;
 height:145px;
 object-fit:cover;
 border-radius:14px;
 background:#05070b;
}

/* PROFILE */
.profileTop{
 text-align:center;
 padding:5px 0 18px;
}
.profileAvatar{
 width:86px;
 height:86px;
 margin:auto;
 border-radius:28px;
 display:grid;
 place-items:center;
 background:linear-gradient(135deg,#183025,#11243c);
 border:1px solid var(--line);
 font-size:35px;
 overflow:hidden;
}
.profileAvatar img{
 width:100%;
 height:100%;
 object-fit:cover;
}
.profileName{
 font-size:21px;
 font-weight:900;
 margin-top:10px;
}
.profileSub{
 color:#7f8c9c;
 font-size:10px;
 margin-top:3px;
}
.statGrid{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:8px;
 margin:15px 0;
}
.stat{
 padding:13px 7px;
 text-align:center;
 border:1px solid var(--line);
 background:#0a1018;
 border-radius:14px;
}
.stat b{
 display:block;
 font-size:15px;
}
.stat small{
 color:#718092;
 font-size:8px;
}

/* SEARCH */
.searchResults{
 display:flex;
 flex-direction:column;
 gap:8px;
}
.result{
 display:flex;
 align-items:center;
 gap:10px;
 padding:11px;
 border:1px solid var(--line);
 background:#0a1018;
 border-radius:15px;
 cursor:pointer;
}
.resultMain{
 flex:1;
 min-width:0;
}
.resultName{
 font-size:12px;
 font-weight:800;
}
.resultDesc{
 font-size:9px;
 color:#768393;
 margin-top:3px;
 white-space:nowrap;
 overflow:hidden;
 text-overflow:ellipsis;
}
.resultDist{
 font-size:9px;
 color:var(--green);
}

/* TOAST */
#toastBox{
 position:absolute;
 z-index:5000;
 left:12px;
 right:12px;
 top:calc(120px + env(safe-area-inset-top));
 display:flex;
 flex-direction:column;
 align-items:center;
 gap:7px;
 pointer-events:none;
}
.toast{
 max-width:390px;
 padding:11px 14px;
 border-radius:14px;
 background:#111a26;
 border:1px solid var(--line2);
 box-shadow:0 15px 40px rgba(0,0,0,.35);
 color:#e9eff6;
 font-size:11px;
 animation:toastIn .25s ease;
}
.toast.ok{border-color:rgba(36,229,138,.35)}
.toast.warn{border-color:rgba(255,179,71,.4)}
.toast.err{border-color:rgba(255,85,112,.4)}
@keyframes toastIn{
 from{opacity:0;transform:translateY(-8px)}
 to{opacity:1;transform:translateY(0)}
}

/* LOADING */
.loader{
 position:fixed;
 inset:0;
 z-index:9999;
 background:#05070b;
 display:grid;
 place-items:center;
 transition:.35s;
}
.loader.hide{
 opacity:0;
 pointer-events:none;
}
.loaderInner{text-align:center}
.loaderLogo{
 width:75px;
 height:75px;
 border-radius:25px;
 display:grid;
 place-items:center;
 margin:auto;
 background:linear-gradient(135deg,var(--green),#087cff);
 color:#00140b;
 font-size:34px;
 font-weight:900;
 box-shadow:0 0 60px rgba(36,229,138,.2);
 animation:pulse 1.5s infinite;
}
.loaderTitle{
 margin-top:14px;
 font-weight:900;
 letter-spacing:1px;
}
.loaderSub{
 color:#6f7d8d;
 font-size:10px;
 margin-top:5px;
}
@keyframes pulse{
 0%,100%{transform:scale(1)}
 50%{transform:scale(1.05)}
}

/* TOGGLE */
.switch{
 width:48px;
 height:28px;
 border-radius:20px;
 background:#1a2531;
 border:1px solid var(--line);
 position:relative;
 cursor:pointer;
}
.switch i{
 position:absolute;
 width:20px;
 height:20px;
 top:3px;
 left:3px;
 border-radius:50%;
 background:#788595;
 transition:.2s;

<script>
"use strict";

/* ============================================================
   ARWORLD CORE ENGINE
   Single-file GitHub Pages prototype
   ============================================================ */

const APP = {
 version:"1.0.0",
 name:"ARWORLD",
 storage:"arworld_database_v1",
 settings:"arworld_settings_v1",
 maxMedia:20,
 maxVideoSize:150*1024*1024,
 maxImageSize:20*1024*1024
};

const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];

const state = {
 map:null,
 userMarker:null,
 accuracyCircle:null,
 watchId:null,
 lat:null,
 lng:null,
 accuracy:null,
 heading:null,
 compass:false,
 follow:false,
 objects:[],
 selected:null,
 search:"",
 cameraStream:null,
 cameraFacing:"environment",
 cameraMode:"photo",
 cameraRecording:false,
 cameraRecorder:null,
 cameraChunks:[],
 cameraTimer:null,
 composer:null,
 media:[],
 mediaUrls:[],
 tempAvatar:null,
 currentSheet:"",
 installPrompt:null
};

/* ============================================================
   UTILITIES
   ============================================================ */

function uid(prefix="obj"){
 return prefix+"_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,9);
}

function esc(value){
 return String(value ?? "")
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");
}

function toast(message,type=""){
 const box=$("#toastBox");
 const el=document.createElement("div");
 el.className="toast "+type;
 el.textContent=message;
 box.appendChild(el);
 setTimeout(()=>el.remove(),3000);
}

function sleep(ms){
 return new Promise(resolve=>setTimeout(resolve,ms));
}

function clamp(v,min,max){
 return Math.max(min,Math.min(max,v));
}

function fmtDistance(m){
 if(!isFinite(m)) return "—";
 if(m<1000) return Math.round(m)+" m";
 return (m/1000).toFixed(m<10000?1:2)+" km";
}

function fmtSize(bytes){
 if(bytes<1024) return bytes+" B";
 if(bytes<1024*1024) return (bytes/1024).toFixed(1)+" KB";
 if(bytes<1024*1024*1024) return (bytes/1024/1024).toFixed(1)+" MB";
 return (bytes/1024/1024/1024).toFixed(1)+" GB";
}

function now(){
 return new Date().toISOString();
}

function haversine(lat1,lng1,lat2,lng2){
 const R=6371000;
 const p1=lat1*Math.PI/180;
 const p2=lat2*Math.PI/180;
 const dp=(lat2-lat1)*Math.PI/180;
 const dl=(lng2-lng1)*Math.PI/180;
 const a=Math.sin(dp/2)**2+
  Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;
 return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

function bearing(lat1,lng1,lat2,lng2){
 const p1=lat1*Math.PI/180;
 const p2=lat2*Math.PI/180;
 const dl=(lng2-lng1)*Math.PI/180;
 const y=Math.sin(dl)*Math.cos(p2);
 const x=Math.cos(p1)*Math.sin(p2)-
   Math.sin(p1)*Math.cos(p2)*Math.cos(dl);
 return (Math.atan2(y,x)*180/Math.PI+360)%360;
}

function directionText(deg){
 const dirs=["Ş","ŞƏ","Ş","CƏ","C","CŞ","Q","QŞ"];
 return dirs[Math.round(deg/45)%8];
}

function typeLabel(type){
 const m={
  profile:"Profil",
  business:"Biznes",
  service:"Xidmət",
  place:"Məkan",
  article:"Məqalə",
  ad:"Reklam",
  event:"Tədbir",
  tourist:"Turizm",
  notice:"Elan"
 };
 return m[type]||"Obyekt";
}

function typeIcon(type){
 const m={
  profile:"👤",
  business:"🏢",
  service:"🛠️",
  place:"📍",
  article:"📖",
  ad:"📢",
  event:"🎟️",
  tourist:"🏔️",
  notice:"📌"
 };
 return m[type]||"🌐";
}

/* ============================================================
   LOCAL DATABASE
   ============================================================ */

function dbLoad(){
 try{
  const raw=localStorage.getItem(APP.storage);
  if(!raw) return [];
  const data=JSON.parse(raw);
  return Array.isArray(data)?data:[];
 }catch(e){
  console.error(e);
  return [];
 }
}

function dbSave(){
 try{
  localStorage.setItem(APP.storage,JSON.stringify(state.objects));
  return true;
 }catch(e){
  console.error(e);
  toast("Yaddaşa yazmaq mümkün olmadı","err");
  return false;
 }
}

function settingsLoad(){
 try{
  return JSON.parse(localStorage.getItem(APP.settings)||"{}");
 }catch(e){
  return {};
 }
}

function settingsSave(obj){
 try{
  localStorage.setItem(APP.settings,JSON.stringify(obj));
 }catch(e){}
}

/*
 IndexedDB əlavə media saxlamaq üçün istifadə olunur.
 localStorage yalnız metadata üçün saxlanılır.
 */

const MediaDB = {
 db:null,

 async open(){
  if(this.db) return this.db;

  return new Promise((resolve,reject)=>{
   if(!window.indexedDB){
    resolve(null);
    return;
   }

   const req=indexedDB.open("ARWORLD_MEDIA",1);

   req.onupgradeneeded=e=>{
    const db=e.target.result;
    if(!db.objectStoreNames.contains("media")){
     db.createObjectStore("media",{keyPath:"id"});
    }
   };

   req.onsuccess=e=>{
    this.db=e.target.result;
    resolve(this.db);
   };

   req.onerror=()=>{
    resolve(null);
   };
  });
 },

 async put(blob,type,name){
  const db=await this.open();
  if(!db) return null;

  const id=uid("media");

  return new Promise(resolve=>{
   const tx=db.transaction("media","readwrite");
   tx.objectStore("media").put({
    id,
    blob,
    type,
    name,
    created:Date.now()
   });
   tx.oncomplete=()=>resolve(id);
   tx.onerror=()=>resolve(null);
  });
 },

 async get(id){
  const db=await this.open();
  if(!db) return null;

  return new Promise(resolve=>{
   const tx=db.transaction("media","readonly");
   const req=tx.objectStore("media").get(id);
   req.onsuccess=()=>resolve(req.result||null);
   req.onerror=()=>resolve(null);
  });
 },

 async remove(id){
  const db=await this.open();
  if(!db) return;

  return new Promise(resolve=>{
   const tx=db.transaction("media","readwrite");
   tx.objectStore("media").delete(id);
   tx.oncomplete=()=>resolve();
   tx.onerror=()=>resolve();
  });
 },

 async clear(){
  const db=await this.open();
  if(!db) return;

  return new Promise(resolve=>{
   const tx=db.transaction("media","readwrite");
   tx.objectStore("media").clear();
   tx.oncomplete=()=>resolve();
   tx.onerror=()=>resolve();
  });
 }
};

/* ============================================================
   MAP
   ============================================================ */

function initMap(){
 state.map=L.map("map",{
  zoomControl:false,
  attributionControl:true,
  minZoom:3,
  maxZoom:20,
  preferCanvas:true
 }).setView([40.4093,49.8671],13);

 L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
   maxZoom:20,
   attribution:'© OpenStreetMap contributors'
  }
 ).addTo(state.map);

 state.map.on("moveend",renderObjects);
}

function updateUserMarker(){
 if(!state.map||state.lat==null||state.lng==null) return;

 const latlng=[state.lat,state.lng];

 if(!state.userMarker){
  const icon=L.divIcon({
   className:"",
   html:`
    <div style="
      width:22px;
      height:22px;
      border-radius:50%;
      background:#24e58a;
      border:4px solid #07100b;
      box-shadow:0 0 0 8px rgba(36,229,138,.15),0 0 25px rgba(36,229,138,.65);
    "></div>
   `,
   iconSize:[22,22],
   iconAnchor:[11,11]
  });

  state.userMarker=L.marker(latlng,{icon,zIndexOffset:1000})
   .addTo(state.map);

  state.accuracyCircle=L.circle(latlng,{
   radius:state.accuracy||20,
   color:"#24e58a",
   fillColor:"#24e58a",
   fillOpacity:.05,
   weight:1
  }).addTo(state.map);

 }else{
  state.userMarker.setLatLng(latlng);
  state.accuracyCircle.setLatLng(latlng);
  state.accuracyCircle.setRadius(state.accuracy||20);
 }

 if(state.follow){
  state.map.setView(latlng,state.map.getZoom(),{animate:true});
 }

 renderObjects();
}

function centerUser(zoom=17){
 if(state.lat==null||state.lng==null){
  toast("Əvvəl GPS icazəsi verilməlidir","warn");
  startGPS();
  return;
 }
 state.follow=true;
 state.map.setView([state.lat,state.lng],zoom,{animate:true});
 $("#locateTool").classList.add("active");
}

function stopFollow(){
 state.follow=false;
 $("#locateTool").classList.remove("active");
}

/* ============================================================
   GPS
   ============================================================ */

function startGPS(){
 if(!navigator.geolocation){
  toast("Bu brauzer GPS dəstəkləmir","err");
  return;
 }

 $("#gpsStatus").textContent="GPS qoşulur...";
 $("#gpsDot").className="dot warn";

 if(state.watchId!==null){
  navigator.geolocation.clearWatch(state.watchId);
 }

 state.watchId=navigator.geolocation.watchPosition(
  pos=>{
   state.lat=pos.coords.latitude;
   state.lng=pos.coords.longitude;
   state.accuracy=pos.coords.accuracy;

   $("#gpsStatus").textContent=
    "GPS ±"+Math.round(state.accuracy)+"m";

   $("#gpsDot").className="dot on";

   updateUserMarker();
   updateNearby();
  },
  err=>{
   console.warn(err);

   $("#gpsDot").className="dot warn";

   if(err.code===1){
    $("#gpsStatus").textContent="GPS icazəsi yoxdur";
    toast("Brauzerdə məkan icazəsini aktivləşdir","warn");
   }else{
    $("#gpsStatus").textContent="GPS tapılmadı";
   }
  },
  {
   enableHighAccuracy:true,
   maximumAge:3000,
   timeout:15000
  }
 );
}

/* ============================================================
   COMPASS
   ============================================================ */

async function startCompass(){
 try{
  if(typeof DeviceOrientationEvent==="undefined"){
   toast("Bu cihaz kompas məlumatı vermir","warn");
   return;
  }

  if(typeof DeviceOrientationEvent.requestPermission==="function"){
   const p=await DeviceOrientationEvent.requestPermission();
   if(p!=="granted"){
    toast("Kompas icazəsi verilmədi","warn");
    return;
   }
  }

  window.addEventListener("deviceorientation",onOrientation,true);

  state.compass=true;
  $("#compassDot").className="dot on";
  $("#compassStatus").textContent="Kompas aktiv";
  $("#compassTool").classList.add("active");

 }catch(e){
  console.error(e);
  toast("Kompas aktivləşmədi","warn");
 }
}

function onOrientation(e){
 let h=null;

 if(typeof e.webkitCompassHeading==="number"){
  h=e.webkitCompassHeading;
 }else if(typeof e.alpha==="number"){
  h=360-e.alpha;
 }

 if(h==null) return;

 state.heading=(h+360)%360;

 if(state.selected){
  renderDetailDirection();
 }
}

function renderDetailDirection(){
 const el=$("#detailDirection");
 if(!el||state.selected==null||state.lat==null) return;

 const o=state.objects.find(x=>x.id===state.selected);
 if(!o) return;

 const b=bearing(state.lat,state.lng,o.lat,o.lng);

 let diff=b-(state.heading||0);
 while(diff>180) diff-=360;
 while(diff<-180) diff+=360;

 const arrow=Math.round(diff);

 el.innerHTML=
  `🧭 ${Math.round(b)}° · ${arrow>0?"sağa":"sola"} ${Math.abs(arrow)}°`;
}

/* ============================================================
   OBJECT DATA
   ============================================================ */

function createDemoObjects(){
 /*
  DEMO obyektləri istifadəçinin real koordinatı məlum olduqdan
  sonra avtomatik yaxınlığa köçürmürük.
  Buna görə saxta "real istifadəçi" göstərmirik.
 */
 return [];
}

function normalizeObject(o){
 return {
  id:o.id||uid(),
  type:o.type||"profile",
  title:o.title||"Adsız obyekt",
  description:o.description||"",
  category:o.category||"",
  author:o.author||"ARWORLD User",
  lat:Number(o.lat),
  lng:Number(o.lng),
  created:o.created||now(),
  updated:o.updated||now(),
  phone:o.phone||"",
  website:o.website||"",
  address:o.address||"",
  price:o.price||"",
  tags:Array.isArray(o.tags)?o.tags:[],
  media:Array.isArray(o.media)?o.media:[],
  avatar:o.avatar||null,
  public:o.public!==false,
  likes:Number(o.likes||0),
  views:Number(o.views||0)
 };
}

function addObject(obj){
 const clean=normalizeObject(obj);

 if(!isFinite(clean.lat)||!isFinite(clean.lng)){
  toast("Düzgün koordinat yoxdur","err");
  return false;
 }

 state.objects.unshift(clean);
 dbSave();
 renderObjects();
 updateNearby();
 updateCount();

 return clean;
}

function removeObject(id){
 const index=state.objects.findIndex(x=>x.id===id);
 if(index<0) return;

 state.objects.splice(index,1);
 dbSave();
 renderObjects();
 updateNearby();
 updateCount();

 if(state.selected===id){
  state.selected=null;
  closeSheet();
 }

 toast("Obyekt silindi","ok");
}

function updateObject(id,patch){
 const o=state.objects.find(x=>x.id===id);
 if(!o) return;

 Object.assign(o,patch,{updated:now()});
 dbSave();
 renderObjects();
 updateNearby();
}

/* ============================================================
   OBJECT RENDERING
   ============================================================ */

function projectObject(o){
 if(!state.map) return null;

 const p=state.map.latLngToContainerPoint([o.lat,o.lng]);

 return {
  x:p.x,
  y:p.y
 };
}

function visibleObject(o){
 if(!state.map) return false;

 const b=state.map.getBounds();
 return b.contains([o.lat,o.lng]);
}

function objectDistance(o){
 if(state.lat==null||state.lng==null) return Infinity;
 return haversine(state.lat,state.lng,o.lat,o.lng);
}

function renderObjects(){
 const layer=$("#objectLayer");
 if(!layer||!state.map) return;

 layer.innerHTML="";

 const bounds=state.map.getBounds();
 const zoom=state.map.getZoom();

 const list=state.objects
  .filter(o=>o.public!==false)
  .filter(o=>bounds.contains([o.lat,o.lng]))
  .filter(o=>{
   if(zoom<10) return false;
   return true;
  })
  .sort((a,b)=>objectDistance(a)-objectDistance(b))
  .slice(0,80);

 for(const o of list){
  const p=projectObject(o);
  if(!p) continue;

  const d=objectDistance(o);

  const card=document.createElement("div");
  card.className="worldCard";
  card.style.left=p.x+"px";
  card.style.top=p.y+"px";

  const media=o.media?.[0];

  card.innerHTML=`
   <div class="wcTop">
    <div class="avatar">
     ${
      o.avatar
      ? `<img src="${esc(o.avatar)}">`
      : typeIcon(o.type)
     }
    </div>

    <div style="min-width:0;flex:1">
     <div class="wcName">${esc(o.title)}</div>
     <div class="wcType">${esc(typeLabel(o.type))}</div>
    </div>

    <div class="wcDistance">${fmtDistance(d)}</div>
   </div>

   ${
    o.description
    ? `<div class="wcDesc">${esc(o.description.slice(0,110))}</div>`
    : ""
   }

   ${
    media && media.type==="image" && media.data
    ? `<div class="wcMedia"><img src="${esc(media.data)}"></div>`
    : ""
   }

   <div class="wcBottom">
    <span class="tag">${esc(o.category||"ARWORLD")}</span>
    <span>↗ Bax</span>
   </div>
  `;

  card.addEventListener("click",e=>{
   e.stopPropagation();
   openDetail(o.id);
  });

  layer.appendChild(card);
 }
}

function updateCount(){
 $("#objectCount").textContent=
  state.objects.length+" obyekt";
}

function updateNearby(){
 const box=$("#nearList");
 if(!box) return;

 if(state.lat==null||state.lng==null){
  box.innerHTML=
   `<div class="empty">GPS aktiv olduqda yaxın obyektlər görünəcək.</div>`;
  $("#nearCount").textContent="GPS";
  return;
 }

 const list=state.objects
  .map(o=>({
   ...o,
   distance:objectDistance(o)
  }))
  .filter(o=>o.distance<=10000)
  .sort((a,b)=>a.distance-b.distance)
  .slice(0,12);

 $("#nearCount").textContent=list.length+" yaxın";

 if(!list.length){
  box.innerHTML=
   `<div class="empty">
      Bu radiusda hələ obyekt yoxdur.<br>
      ＋ düyməsi ilə ilk obyektini yerləşdir.
    </div>`;
  return;
 }

 box.innerHTML=list.map(o=>`
  <div class="nearMini" data-id="${esc(o.id)}">
   <div class="nearMiniTop">
    <div class="avatar">${o.avatar?`<img src="${esc(o.avatar)}">`:typeIcon(o.type)}</div>
    <div style="min-width:0">
     <div class="nearMiniName">${esc(o.title)}</div>
     <div class="nearMiniDist">${fmtDistance(o.distance)}</div>
    </div>
   </div>
  </div>
 `).join("");

 $$(".nearMini",box).forEach(el=>{
  el.onclick=()=>openDetail(el.dataset.id);
 });
}

   SHEET SYSTEM
   ============================================================ */

function openSheet(title,html){
 $("#sheetTitle").textContent=title;
 $("#sheetBody").innerHTML=html;
 $("#sheetOverlay").classList.add("show");

}

function closeSheet(){

 state.selected=null;

$("#sheetClose").onclick=closeSheet;

$("#sheetOverlay").addEventListener("click",e=>{
 if(e.target===$("#sheetOverlay")){
  closeSheet();
 }
});

/* ============================================================
   ADD OBJECT COMPOSER
   ============================================================ */

function defaultComposer(){

/* ============================================================
   IMAGE COMPRESSION
   ============================================================ */

async function imageToDataURL(file,maxW=1280,quality=.82){
 return new Promise((resolve,reject)=>{
  const reader=new FileReader();

  reader.onload=()=>{
   const img=new Image();

   img.onload=()=>{
    let w=img.width;
    let h=img.height;

    if(w>maxW){
     h=Math.round(h*maxW/w);
     w=maxW;
    }

    const canvas=document.createElement("canvas");
    canvas.width=w;
    canvas.height=h;

    const ctx=canvas.getContext("2d");
    ctx.drawImage(img,0,0,w,h);

    resolve(canvas.toDataURL("image/jpeg",quality));
   };

   img.onerror=reject;
   img.src=reader.result;
  };

  reader.onerror=reject;
  reader.readAsDataURL(file);
 });
}

$("#galleryInput").addEventListener("change",async e=>{
 const files=[...e.target.files];

 for(const file of files){
  if(state.media.length>=APP.maxMedia){
   toast("Media limiti: "+APP.maxMedia,"warn");
   break;
  }

  if(file.type.startsWith("image/")){
   if(file.size>APP.maxImageSize){
    toast(file.name+" çox böyükdür","warn");
    continue;
   }

   try{
    const data=await imageToDataURL(file);
    state.media.push({
     id:uid("m"),
     type:"image",
     name:file.name,
     size:file.size,
     data
    });
   }catch(err){
    toast("Şəkil oxunmadı","err");
   }
  }

  else if(file.type.startsWith("video/")){
   if(file.size>APP.maxVideoSize){
    toast("Video 150MB-dan böyükdür","warn");
    continue;
   }

   const data=await fileToDataURL(file);

   state.media.push({
    id:uid("m"),
    type:"video",
    name:file.name,
    size:file.size,
    data
   });
  }
 }

 e.target.value="";

 if(state.currentSheet==="＋ Dünyaya əlavə et"){
  drawMediaList();
 }
});

function fileToDataURL(file){
 return new Promise((resolve,reject)=>{
  const r=new FileReader();
  r.onload=()=>resolve(r.result);
  r.onerror=reject;
  r.readAsDataURL(file);
 });
}

/* ============================================================
   VOICE RECORDER
   ============================================================ */

async function startVoiceRecording(){
 if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){
  toast("Bu brauzerdə səs yazma dəstəklənmir","warn");
  return;
 }

 let stream=null;

 try{
  stream=await navigator.mediaDevices.getUserMedia({
   audio:{
    echoCancellation:true,
    noiseSuppression:true,
    autoGainControl:true
   }
  });

  const mime=[
   "audio/webm;codecs=opus",
   "audio/webm",
   "audio/ogg;codecs=opus"
  ].find(x=>MediaRecorder.isTypeSupported(x))||"";

  const recorder=mime
   ? new MediaRecorder(stream,{mimeType:mime})
   : new MediaRecorder(stream);

  const chunks=[];
  let started=Date.now();

  recorder.ondataavailable=e=>{
   if(e.data?.size) chunks.push(e.data);
  };

  recorder.onstop=()=>{
   stream.getTracks().forEach(t=>t.stop());

   const blob=new Blob(chunks,{
    type:recorder.mimeType||"audio/webm"
   });

   const r=new FileReader();

   r.onload=()=>{
    state.media.push({
     id:uid("voice"),
     type:"audio",
     name:"ARWORLD Voice "+new Date().toLocaleTimeString(),
     size:blob.size,
     data:r.result
    });

    drawMediaList();
    toast("Səs yazısı əlavə edildi","ok");
   };

   r.readAsDataURL(blob);

   if(state.voiceTimer){
    clearInterval(state.voiceTimer);
    state.voiceTimer=null;
   }

   if(state.voiceButton){
    state.voiceButton.textContent="🎙";
   }

   state.voiceRecorder=null;
  };

  state.voiceRecorder=recorder;
  state.voiceButton=$("#voiceBtn");

  recorder.start(250);

  state.voiceButton.textContent="⏹";

  toast("Səs yazılır... dayandırmaq üçün yenidən bas","ok");

  state.voiceTimer=setInterval(()=>{
   if(!state.voiceRecorder) return;

   const sec=Math.floor((Date.now()-started)/1000);

   if(state.voiceButton){
    state.voiceButton.innerHTML=`⏹<small>${sec}s</small>`;
   }

   if(sec>=120){
    recorder.stop();
   }
  },1000);

 }catch(e){
  if(stream) stream.getTracks().forEach(t=>t.stop());
  toast("Mikrofon icazəsi verilmədi","warn");
 }
}

async function openCamera(mode="photo"){
 if(!navigator.mediaDevices?.getUserMedia){
  toast("Kamera bu brauzerdə dəstəklənmir","err");
  return;
 }

 state.cameraMode=mode;

 $("#cameraMode").textContent=
  mode==="video"?"VİDEO":"FOTO";

 $("#cameraOverlay").classList.add("show");

 try{
  await startCameraStream();
 }catch(e){
  console.error(e);
  $("#cameraOverlay").classList.remove("show");
  toast("Kameraya giriş mümkün olmadı","warn");
 }
}

async function startCameraStream(){
 if(state.cameraStream){
  state.cameraStream.getTracks().forEach(t=>t.stop());
 }

 state.cameraStream=await navigator.mediaDevices.getUserMedia({
  video:{
   facingMode:{ideal:state.cameraFacing},
   width:{ideal:1920},
   height:{ideal:1080}
  },
  audio:state.cameraMode==="video"
 });

 const video=$("#cameraVideo");
 video.srcObject=state.cameraStream;
 await video.play();
}

function closeCamera(){
 if(state.cameraRecorder){
  try{state.cameraRecorder.stop()}catch(e){}
 }

 if(state.cameraStream){
  state.cameraStream.getTracks().forEach(t=>t.stop());
  state.cameraStream=null;
 }

 $("#cameraVideo").srcObject=null;
 $("#cameraOverlay").classList.remove("show");
}

$("#cameraClose").onclick=closeCamera;

$("#cameraSwitch").onclick=async()=>{
 state.cameraFacing=

  :"environment";

 try{

function capturePhoto(){
 const video=$("#cameraVideo");

 if(video.readyState<2){
  toast("Kamera hazır deyil","warn");
  return;
 }

 const canvas=document.createElement("canvas");
 canvas.width=video.videoWidth||1280;
 canvas.height=video.videoHeight||720;

 const ctx=canvas.getContext("2d");

 if(state.cameraFacing==="user"){
  ctx.translate(canvas.width,0);
  ctx.scale(-1,1);
 }

 ctx.drawImage(video,0,0,canvas.width,canvas.height);

 const data=canvas.toDataURL("image/jpeg",.86);

 state.media.push({
  id:uid("photo"),
  type:"image",
  name:"ARWORLD Photo.jpg",
  size:Math.round(data.length*.75),
  data
 });

 closeCamera();

 if(state.currentSheet==="＋ Dünyaya əlavə et"){
  drawMediaList();
 }

 toast("Foto əlavə edildi","ok");
}

function startCameraVideo(){
 const video=$("#cameraVideo");

 const mime=[
  "video/webm;codecs=vp9",
  "video/webm;codecs=vp8",
  "video/webm"
 ].find(x=>MediaRecorder.isTypeSupported(x))||"";

 try{
  state.cameraChunks=[];

  state.cameraRecorder=mime
   ? new MediaRecorder(state.cameraStream,{mimeType:mime})
   : new MediaRecorder(state.cameraStream);

  state.cameraRecorder.ondataavailable=e=>{
   if(e.data?.size) state.cameraChunks.push(e.data);
  };

  state.cameraRecorder.onstop=()=>{
   const blob=new Blob(state.cameraChunks,{
    type:state.cameraRecorder.mimeType||"video/webm"
   });

   const reader=new FileReader();

   reader.onload=()=>{
    state.media.push({
     id:uid("video"),
     type:"video",
     name:"ARWORLD Video.webm",
     size:blob.size,
     data:reader.result
    });

    state.cameraRecorder=null;
    state.cameraChunks=[];

    closeCamera();

    if(state.currentSheet==="＋ Dünyaya əlavə et"){
     drawMediaList();
    }

    toast("Video əlavə edildi","ok");
   };

   reader.readAsDataURL(blob);
  };

  state.cameraRecorder.start(500);
  $("#cameraCapture").textContent="■";
  toast("Video yazılır...","ok");

 }catch(e){
  console.error(e);
  toast("Video yazmaq mümkün olmadı","err");
 }
}

function stopCameraVideo(){
 if(!state.cameraRecorder) return;

 state.cameraRecorder.stop();
 $("#cameraCapture").textContent="●";
}

function renderSearchResults(q){

 if(!box) return;

 let list=state.objects.map(o=>({
  ...o,
  distance:objectDistance(o)
 }));

 if(query){
  list=list.filter(o=>{

    o.title,
    o.description,
    o.category,
    o.address,
    o.author,
    ...(o.tags||[])
   ].join(" ").toLowerCase();

   return hay.includes(query);
  });
 }

 list.sort((a,b)=>{

  return 0;

/* ============================================================
   ADVANCED SPATIAL ENGINE
   ============================================================ */

const SpatialEngine = {

 getNearby(radius=1000){
  if(state.lat==null||state.lng==null) return [];

  return state.objects
   .map(o=>({
    object:o,
    distance:haversine(
     state.lat,
     state.lng,
     o.lat,
     o.lng
    )
   }))
   .filter(x=>x.distance<=radius)
   .sort((a,b)=>a.distance-b.distance);
 },

 getBearing(o){
  if(state.lat==null||state.lng==null) return null;

  return bearing(
   state.lat,
   state.lng,
   o.lat,
   o.lng
  );
 },

 getRelativeAngle(o){
  const b=this.getBearing(o);

  if(b==null||state.heading==null) return null;

  let d=b-state.heading;

  while(d>180) d-=360;
  while(d<-180) d+=360;

  return d;
 },

 classifyDistance(m){
  if(m<20) return "ÇOX YAXIN";
  if(m<100) return "YAXIN";
  if(m<500) return "YAXINLIQDA";
  if(m<1000) return "1 KM";
  if(m<5000) return "5 KM";
  return "UZAQ";
 }
};

 base:null,

 async createObject(obj){

   };

    },

   }
  );

  if(!response.ok){

const Analytics={

 key:"arworld_analytics_v1",

 get(){
  try{
   return JSON.parse(
    localStorage.getItem(this.key)||"{}"
   );
  }catch(e){
   return {};
  }
 },

 event(name,data={}){
  const a=this.get();

  if(!a.events) a.events=[];

  a.events.push({
   name,
   data,
   time:Date.now()
  });

  if(a.events.length>1000){
   a.events.splice(0,a.events.length-1000);
  }

  try{
   localStorage.setItem(this.key,JSON.stringify(a));
  }catch(e){}
 }
};

const ARWORLDUtils={

 normalizeURL(url){
  if(!url) return "";
  if(/^https?:\/\//i.test(url)) return url;
  return "https://"+url;
 },

 validCoordinate(lat,lng){
  return isFinite(lat)&&
   isFinite(lng)&&
   lat>=-90&&
   lat<=90&&
   lng>=-180&&
   lng<=180;
 },

 makeGoogleMapsURL(lat,lng){
  return "https://www.google.com/maps/search/?api=1&query="+
   encodeURIComponent(lat+","+lng);
 },

 makeOSMURL(lat,lng){
  return "https://www.openstreetmap.org/?mlat="+
   encodeURIComponent(lat)+
   "&mlon="+
   encodeURIComponent(lng)+
   "#map=18/"+lat+"/"+lng;
 }
};

   MEDIA CLEANUP
   ============================================================ */

window.addEventListener("pagehide",()=>{
 if(state.cameraStream){
  state.cameraStream.getTracks().forEach(t=>t.stop());
 }

 if(state.watchId!==null){
  try{
   navigator.geolocation.clearWatch(state.watchId);
  }catch(e){}
 }
});

/* ============================================================
   GLOBAL DEBUG API
   ============================================================ */

window.ARWORLD={
 state,
 SpatialEngine,
 ARWORLD_API,
 ARWORLDUtils,
 Analytics,
 exportData,
 exportGeoJSON,
 openComposer,
 openSearch,
 openProfile,
 openMore,
 startGPS,
 startCompass
};

/* ============================================================
   END
