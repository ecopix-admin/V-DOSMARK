function saveAds(){try{localStorage.setItem(STORE,JSON.stringify(ads))}catch(e){toast('Yaddaş doludur. Foto sayını azaldın.')}}function saveUrgent(){try{localStorage.setItem(URGENT_STORE,JSON.stringify(urgentItems))}catch(e){}}
const demos=CAT.map((c,i)=>({id:'demo-'+i,name:namesAz[i]||c[0],category:c[0],group:c[4],icon:c[5],color:c[6],description:descAz[i]||`${c[0]} üzrə xidmət və sifarişlər. Qiymət və mövcudluq üçün əlaqə saxlayın.`,phone:'+994 50 000 '+String(1000+i).slice(-4),city:i%3===0?'Bakı':i%3===1?'Sumqayıt':'Xırdalan',address:i%3===0?'Nərimanov, Bakı':i%3===1?'Mərkəz, Sumqayıt':'Mərkəz, Xırdalan',lat:demoCenter[0]+(Math.sin(i*2.7)*0.055),lng:demoCenter[1]+(Math.cos(i*1.9)*0.075),createdAt:Date.now()-((i%22)*86400000),demo:true,photos:[]}));
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function daysLeft(ad){return Math.ceil((Number(ad.createdAt)+30*86400000-Date.now())/86400000)}
function distM(a,b){const R=6371000,p1=a.lat*Math.PI/180,p2=b.lat*Math.PI/180,dp=(b.lat-a.lat)*Math.PI/180,dl=(b.lng-a.lng)*Math.PI/180;const h=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;return 2*R*Math.asin(Math.sqrt(Math.min(1,h)))}
function allListings(){return [...demos,...ads.filter(a=>a.lat!=null&&a.lng!=null)]}
function visibleListings(){let list=allListings();if(categoryFilter!=='all')list=list.filter(a=>['crafts','services','shops','farm','machines'].includes(categoryFilter)?a.group===categoryFilter:a.category===categoryFilter);if(query){const q=query.toLocaleLowerCase();list=list.filter(a=>[a.name,a.category,a.description,a.city,a.address].join(' ').toLocaleLowerCase().includes(q))}if(currentPos&&radius!=='country'){const lim=Number(radius);list=list.filter(a=>distM(currentPos,{lat:a.lat,lng:a.lng})<=lim)}return list}
function labelCategory(c){const item=CAT.find(x=>x[0]===c);return item?item[['az','en','ru','tr'].indexOf(lang)]:c}
function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.remove('show'),2600)}
function setLang(l){lang=l;document.documentElement.lang=l;$$('[data-lang]').forEach(b=>b.classList.toggle('active',b.dataset.lang===l));$('#subtitle').textContent=t('subtitle');$('#emergencyLabel').textContent=t('emergency');$('#searchInput').placeholder=t('search');$('#countryChip').textContent=t('country');$('#navMap').textContent=t('map');$('#navExplore').textContent=t('explore');$('#navProfile').textContent=t('profile');$('#navAdd').textContent=t('add');$('#gpsStatus').textContent=currentPos?t('gpsOk'):t('gpsWait');renderMarkers();if(activeSheet)renderSheet(activeSheet)}
function initMap(){map=L.map('map',{zoomControl:false,preferCanvas:true}).setView(demoCenter,11);L.control.zoom({position:'bottomright'}).addTo(map);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>'}).addTo(map);map.on('move',()=>{updateNearest();});map.on('click',e=>{if(mapPickMode){selectedPlace={lat:e.latlng.lat,lng:e.latlng.lng};mapPickMode=false;toast(t('placeSelected'));$('#gpsStatus').textContent=t('placeSelected');if(activeSheet==='add')renderSheet('add');}});renderMarkers();setTimeout(()=>map.invalidateSize(),200)}
function markerIcon(ad,nearest=false){const c=ad.color||'#69e0bd',icon=ad.icon||'fa-screwdriver-wrench';return L.divIcon({className:'',html:`<div class="marker-wrap ${nearest?'nearest':''}" style="--mc:${c}"><div class="marker-glow"></div><div class="marker-core"><i class="fa-solid ${icon}"></i></div></div>`,iconSize:[38,38],iconAnchor:[19,19]})}
function renderMarkers(){if(!map)return;markers.forEach(m=>map.removeLayer(m));markers=[];visibleListings().forEach(ad=>{const m=L.marker([ad.lat,ad.lng],{icon:markerIcon(ad,ad.id===nearestId),keyboard:true,title:ad.name}).addTo(map);m.bindPopup(`<div class="popup-title">${esc(ad.name)}</div><div class="popup-sub">${esc(labelCategory(ad.category))} · ${esc(ad.city||'')}</div><button class="popup-open" onclick="window.__openListing('${esc(ad.id)}')">${esc(t('open'))}</button>`);m.on('click',()=>{activeListing=ad.id});markers.push(m)});$('#mapCount').textContent=visibleListings().length;$('#mapHintText').textContent=t('map');updateNearest()}
function updateNearest(){if(!map)return;const center=map.getCenter();const list=visibleListings();if(!list.length)return;let best=null,bd=Infinity;list.forEach(a=>{const d=map.distance(center,[a.lat,a.lng]);if(d<bd){bd=d;best=a}});if(best&&best.id!==nearestId){nearestId=best.id;markers.forEach(m=>{const ll=m.getLatLng(),ad=list.find(a=>a.lat===ll.lat&&a.lng===ll.lng);if(ad)m.setIcon(markerIcon(ad,ad.id===nearestId))})}}
window.__openListing=id=>{activeListing=id;openSheet('detail')};
function setUserPosition(pos){currentPos={lat:pos.coords.latitude,lng:pos.coords.longitude};if(userMarker)map.removeLayer(userMarker);userMarker=L.marker([currentPos.lat,currentPos.lng],{icon:L.divIcon({className:'',html:'<div class="user-dot"></div>',iconSize:[22,22],iconAnchor:[11,11]}),zIndexOffset:1000}).addTo(map).bindPopup('Sizin mövqeyiniz');$('#gpsStatus').textContent=t('gpsOk');if(radius!=='country')renderMarkers()}
function getGPS(center=true){if(!navigator.geolocation){toast(t('gpsFail'));return}$('#gpsStatus').textContent=t('gpsWait');navigator.geolocation.getCurrentPosition(p=>{setUserPosition(p);if(center)map.setView([currentPos.lat,currentPos.lng],15);if(activeSheet==='add')renderSheet('add')},()=>{ $('#gpsStatus').textContent=t('gpsFail');toast(t('permission'))},{enableHighAccuracy:true,timeout:12000,maximumAge:30000})}
function openSheet(view,opts={}){activeSheet=view;$('#sheet').classList.add('open');renderSheet(view,opts);$$('.navitem').forEach(b=>b.classList.toggle('active',b.dataset.view===view||(view==='detail'&&b.dataset.view==='list')))}
function closeSheet(){activeSheet='';$('#sheet').classList.remove('open');mapPickMode=false;$$('.navitem').forEach(b=>b.classList.toggle('active',b.dataset.view==='map'))}
function renderSheet(view,opts={}){const body=$('#sheetBody');let title=t('listTitle'),content='';if(view==='list'){title=t('listTitle');content=listHTML(visibleListings())}else if(view==='profile'){title=t('myAds');content=profileHTML()}else if(view==='add'){title=t('newAd');content=addHTML()}else if(view==='detail'){const ad=allListings().find(a=>a.id===activeListing);title=ad?ad.name:t('open');content=ad?detailHTML(ad):'<div class="empty">—</div>'}else if(view==='menu'){title=t('settings');content=menuHTML()}else if(view==='legal'){title=t('legal');content=legalHTML()}else if(view==='filters'){title=t('filters');content=filtersHTML()}else if(view==='urgent'){title=t('urgentTitle');content=urgentHTML()}$('#sheetTitle').textContent=title;body.innerHTML=content;bindSheetEvents(view)}
function listHTML(list){if(!list.length)return `<div class="empty"><i class="fa-solid fa-magnifying-glass"></i>${t('noResults')}</div>`;return `<div class="card"><div class="row between"><span class="tag green">${list.length} ${t('listTitle').toLowerCase()}</span><span class="small muted">${t('demoNotice')}</span></div></div>`+list.map(ad=>`<div class="card"><div class="listing"><div class="avatar" style="color:${ad.color||'#69e0bd'}"><i class="fa-solid ${ad.icon||'fa-screwdriver-wrench'}"></i></div><div class="grow"><h3>${esc(ad.name)}</h3><div class="small muted">${esc(labelCategory(ad.category))} · ${esc(ad.city||'')}</div><div class="small">${esc(ad.description)}</div><div class="row" style="margin-top:6px;flex-wrap:wrap"><span class="tag">${ad.demo?t('demo'):t('days30')}</span>${currentPos?`<span class="tag">${formatDistance(distM(currentPos,{lat:ad.lat,lng:ad.lng}))}</span>`:''}</div></div></div><div class="listing-actions"><button class="primary" data-detail="${esc(ad.id)}">${t('open')}</button><button class="secondary" data-route="${ad.lat},${ad.lng}"><i class="fa-solid fa-location-arrow"></i></button></div></div>`).join('')}
function formatDistance(m){return m<1000?Math.round(m)+' m':(m/1000).toFixed(1)+' km'}
function profileHTML(){if(!ads.length)return `<div class="card"><div class="empty"><i class="fa-solid fa-user-astronaut"></i>${t('noAds')}<br><button class="primary" data-action="add" style="margin-top:14px">${t('add')}</button></div></div><div class="card small muted">${t('renewInfo')} ${t('demoNotice')}</div>`;return `<div class="card"><div class="row between"><div><h3>${t('myAds')}</h3><div class="small muted">${ads.length} ${t('listTitle').toLowerCase()}</div></div><button class="primary" data-action="add"><i class="fa-solid fa-plus"></i> ${t('add')}</button></div></div>`+ads.map(a=>{const d=daysLeft(a);return `<div class="card"><div class="listing"><div class="avatar"><i class="fa-solid ${a.icon||'fa-screwdriver-wrench'}"></i></div><div class="grow"><h3>${esc(a.name)}</h3><div class="small muted">${esc(a.category)} · ${esc(a.city||'')}</div><span class="tag ${d<=3?'red':'green'}">${d>0?d+' '+t('days'):t('expired')}</span></div></div><div class="listing-actions"><button class="secondary" data-renew="${esc(a.id)}">${t('renew')}</button><button class="danger" data-delete="${esc(a.id)}">${t('delete')}</button><button class="secondary" data-detail="${esc(a.id)}">${t('open')}</button></div></div>`}).join('')}
function detailHTML(ad){const own=!ad.demo;const pics=(ad.photos||[]).map(src=>`<img src="${src}" alt="" style="width:100%;max-height:240px;object-fit:cover;border-radius:12px;margin-bottom:6px">`).join('');return `<div class="card"><div class="profilehero"><div class="avatar" style="color:${ad.color||'#69e0bd'}"><i class="fa-solid ${ad.icon||'fa-screwdriver-wrench'}"></i></div><div class="grow"><h3>${esc(ad.name)}</h3><div class="small muted">${esc(labelCategory(ad.category))} · ${esc(ad.city||'')}</div><div style="margin-top:6px"><span class="tag ${own?'green':'gold'}">${own?t('days30'):t('demo')}</span></div></div></div><p class="small">${esc(ad.description)}</p><div class="small muted"><i class="fa-solid fa-location-dot"></i> ${esc(ad.address||ad.city||'')} </div>${own?`<div class="small muted" style="margin-top:5px">${esc(ad.phone||'')}</div>`:`<div class="small muted" style="margin-top:8px">${t('demoNotice')}</div>`}<div style="margin-top:12px;display:flex;gap:8px"><button class="primary" data-call="${esc(ad.phone||'')}"><i class="fa-solid fa-phone"></i> ${t('call')}</button><button class="secondary" data-route="${ad.lat},${ad.lng}"><i class="fa-solid fa-location-arrow"></i> ${t('tapMap')}</button></div></div>${pics?`<div class="card">${pics}</div>`:''}<div class="video-ad"><div class="small muted" style="margin-bottom:8px">${t('videoAd')}</div><div class="advisual"><div class="adlabel">SPONSORED</div><i class="fa-solid fa-play play"></i><div class="adword">BUILD • REPAIR • SERVICE</div></div><div class="small muted" style="margin-top:8px">${t('adDesc')}</div></div>${own?`<div class="card"><div class="small muted">${t('renewInfo')}</div><button class="secondary full" style="margin-top:9px" data-renew="${esc(ad.id)}">${t('renew')}</button></div>`:''}`}
function addHTML(){const cats=CAT.map(c=>`<option value="${esc(c[0])}">${esc(c[['az','en','ru','tr'].indexOf(lang)])}</option>`).join('');return `<div class="card small muted">${t('freeGps')}<br>${t('renewInfo')}</div><form id="adForm"><div class="field"><label>${t('name')} *</label><input name="name" required maxlength="70" placeholder="${t('name')}"></div><div class="field"><label>${t('category')} *</label><select name="category" required><option value="">${t('selectCategory')}</option>${cats}</select></div><div class="field"><label>Elan növü</label><div class="grid2"><label class="card" style="margin:0;padding:10px"><input type="radio" name="plan" value="free" checked> <b>${t('free')}</b><div class="small muted">0 AZN</div></label><label class="card" style="margin:0;padding:10px"><input type="radio" name="plan" value="vip"> <b>${t('vip')}</b></label></div></div><div class="field"><label>${t('phone')} *</label><input name="phone" type="tel" required maxlength="30" placeholder="+994 ..."></div><div class="field"><label>${t('description')} *</label><textarea name="description" required maxlength="700" placeholder="${t('description')}"></textarea></div><div class="grid2"><div class="field"><label>${t('city')}</label><input name="city" id="adCity" maxlength="80" placeholder="Bakı"></div><div class="field"><label>${t('address')}</label><input name="address" id="adAddress" maxlength="120" placeholder="Küçə / ərazi"></div></div><div class="field"><label>${t('photos')}</label><input id="photoInput" type="file" accept="image/*" multiple capture="environment"><div class="help">Şəkillər bu cihazda saxlanılır; yaddaş limiti cihazdan asılıdır.</div><div id="photoPreview" class="preview-grid"></div></div><div class="card"><div class="row between"><div class="grow"><b class="small">${t('pick')}</b><div class="small muted" id="selectedCoords">${selectedPlace?selectedPlace.lat.toFixed(5)+', '+selectedPlace.lng.toFixed(5):currentPos?currentPos.lat.toFixed(5)+', '+currentPos.lng.toFixed(5):t('locationRequired')}</div></div><button type="button" class="secondary" id="pickPlaceBtn"><i class="fa-solid fa-map-pin"></i></button></div><button type="button" class="secondary full" style="margin-top:9px" id="useGpsBtn"><i class="fa-solid fa-location-crosshairs"></i> ${t('gps')}</button></div><label class="switchrow small muted"><input type="checkbox" name="agree" required><span>${t('terms1')} ${t('terms3')}</span></label><button class="primary full" type="submit" style="margin-top:14px">${t('publish')}</button></form>`}

function legalHTML(){return `<div class="card legal"><h3>${t('privacy')}</h3><p>Elan məlumatları bu brauzerdə saxlanılır və avtomatik olaraq başqa istifadəçilərə ötürülmür. Bu tək-fayllı versiyada elanlar yalnız həmin cihazda görünür; server olmadığı üçün digər istifadəçilərlə sinxronlaşmır. GPS məlumatı yalnız icazə verildikdə oxunur. Ünvanın avtomatik tapılması üçün koordinatlar Nominatim xidmətinə sorğu ilə göndərilir.</p><h3>${t('rules')}</h3><p>${t('terms1')}</p><p>${t('terms2')}</p><p>${t('terms3')}</p><p>VIP qiyməti bu prototipdə yalnız elan növünün etiketidir. Real ödəniş prosessoru qoşulmadığından ödəniş tutulmur və VIP ödənişi təsdiqlənmir. Elan yerləşdirmə qaydalarına və yerli qanunlara əməl etmək istifadəçinin məsuliyyətindədir.</p><button class="primary full" data-action="close">${t('close')}</button></div>`}

function urgentHTML(){return `<form id="urgentForm"><div class="field"><label>${t('urgentKind')}</label><select name="kind">${['Təkər təmiri','Santexnik','Elektrik','Evakuator','Qapı / kilid','Digər xidmət'].map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label>${t('urgentDetails')}</label><textarea name="details" maxlength="300" placeholder="${t('urgentPlaceholder')}"></textarea></div><div class="field"><label>${t('phone')}</label><input name="phone" type="tel" placeholder="+994 ..."></div><button class="primary full" type="submit">${t('sendUrgent')}</button><p class="small muted">Bu demo çağırış yalnız bu cihazda görünür; serverə və digər ustalara göndərilmir.</p></form>`}
function bindSheetEvents(view){$$('[data-detail]').forEach(b=>b.onclick=()=>{activeListing=b.dataset.detail;renderSheet('detail')});$$('[data-route]').forEach(b=>b.onclick=()=>{const [lat,lng]=b.dataset.route.split(',').map(Number);closeSheet();map.setView([lat,lng],15)});$$('[data-action]').forEach(b=>b.onclick=()=>{const a=b.dataset.action;if(a==='add')openSheet('add');else if(a==='profile')openSheet('profile');else if(a==='filters')openSheet('filters');else if(a==='legal')openSheet('legal');else if(a==='close')closeSheet();else if(a==='applyFilters'){categoryFilter=$('#filterCategory').value;radius=$('#filterRadius').value;$$('[data-radius]').forEach(x=>x.classList.toggle('active',x.dataset.radius===radius));renderMarkers();openSheet('list')}});$$('[data-renew]').forEach(b=>b.onclick=()=>{const a=ads.find(x=>x.id===b.dataset.renew);if(a){a.createdAt=Date.now();saveAds();toast(t('renewed'));renderSheet('profile');renderMarkers()}});$$('[data-delete]').forEach(b=>b.onclick=()=>{if(confirm(t('delete')+'?')){ads=ads.filter(x=>x.id!==b.dataset.delete);saveAds();toast(t('deleted'));renderSheet('profile');renderMarkers()}});$$('[data-call]').forEach(b=>b.onclick=()=>{const p=b.dataset.call;if(p&&p.startsWith('+'))location.href='tel:'+p;else toast(t('demoNotice'))});const form=$('#adForm');if(form){const radios=$$('input[name="plan"]');radios.forEach(r=>r.onchange=()=>{if(r.checked&&r.value==='free'&&!currentPos)getGPS(false)});$('#pickPlaceBtn').onclick=()=>{if(form.plan.value==='free'){toast(t('freeGps'));return}closeSheet();mapPickMode=true;toast(t('choosePlace'))};$('#useGpsBtn').onclick=()=>{getGPS(false);setTimeout(()=>{if(currentPos){selectedPlace={...currentPos};$('#selectedCoords').textContent=currentPos.lat.toFixed(5)+', '+currentPos.lng.toFixed(5);reverseGeocode(currentPos.lat,currentPos.lng).then(a=>{if(a.city)$('#adCity').value=a.city;if(a.address)$('#adAddress').value=a.address})}},700)};$('#photoInput').onchange=async e=>{const files=[...e.target.files].slice(0,10);if(e.target.files.length>10)toast(t('photosLimit'));photoData=[];for(const f of files){if(!f.type.startsWith('image/'))continue;try{photoData.push(await compressImage(f))}catch(err){}}$('#photoPreview').innerHTML=photoData.map(src=>`<img src="${src}" alt="preview">`).join('')};form.onsubmit=async e=>{e.preventDefault();const fd=new FormData(form),plan=fd.get('plan');let point=plan==='free'?currentPos:selectedPlace||currentPos;if(!point){toast(t('locationRequired'));getGPS(false);return}if(!fd.get('name').trim()||!fd.get('phone').trim()||!fd.get('description').trim()){toast(t('fillRequired'));return}const cat=CAT.find(c=>c[0]===fd.get('category'));let city=fd.get('city')||'',address=fd.get('address')||'';if(!city||!address){const rev=await reverseGeocode(point.lat,point.lng);city=city||rev.city;address=address||rev.address}const ad={id:'ad-'+Date.now()+'-'+Math.random().toString(36).slice(2,7),name:fd.get('name').trim(),category:fd.get('category'),group:cat?cat[4]:'crafts',icon:cat?cat[5]:'fa-screwdriver-wrench',color:cat?cat[6]:'#69e0bd',phone:fd.get('phone').trim(),description:fd.get('description').trim(),city,address,lat:point.lat,lng:point.lng,createdAt:Date.now(),photos:photoData.slice(0,10),vip:plan==='vip',demo:false};ads.unshift(ad);saveAds();selectedPlace=null;photoData=[];renderMarkers();toast(t('published'));activeListing=ad.id;openSheet('detail');map.setView([ad.lat,ad.lng],14)}}
const uf=$('#urgentForm');if(uf)uf.onsubmit=e=>{e.preventDefault();const fd=new FormData(uf),p=currentPos||{lat:map.getCenter().lat,lng:map.getCenter().lng};urgentItems.unshift({id:'u'+Date.now(),kind:fd.get('kind'),details:fd.get('details')||'',phone:fd.get('phone')||'',lat:p.lat,lng:p.lng,at:Date.now()});saveUrgent();renderUrgent();renderMarkers();toast(t('urgentSent'));closeSheet()}}
function compressImage(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onerror=reject;reader.onload=()=>{const img=new Image();img.onerror=reject;img.onload=()=>{const max=1000,scale=Math.min(1,max/Math.max(img.width,img.height)),canvas=document.createElement('canvas');canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL('image/jpeg',.78))};img.src=reader.result};reader.readAsDataURL(file)})}
async function reverseGeocode(lat,lng){try{const url=`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${encodeURIComponent(lat)}&lon=${encodeURIComponent(lng)}&zoom=18&addressdetails=1`;const r=await fetch(url,{headers:{'Accept-Language':lang}});if(!r.ok)throw new Error('geocode');const j=await r.json(),a=j.address||{};return {city:a.city||a.town||a.village||a.county||a.state||'',address:[a.road,a.house_number,a.suburb||a.neighbourhood].filter(Boolean).join(', ')||j.display_name||''}}catch(e){return {city:'',address:''}}}
function renderUrgent(){const el=$('#urgentStrip');if(!urgentItems.length){el.classList.remove('show');el.innerHTML='';return}el.classList.add('show');el.innerHTML=urgentItems.slice(0,5).map(u=>`<span><i class="fa-solid fa-triangle-exclamation"></i> <b>${esc(t('urgentActive'))}:</b> ${esc(u.kind)} ${esc(u.details)} <button data-remove-urgent="${esc(u.id)}" style="background:transparent;border:0;color:#ffc3ce;margin-left:5px">×</button></span>`).join('');$$('[data-remove-urgent]').forEach(b=>b.onclick=()=>{urgentItems=urgentItems.filter(u=>u.id!==b.dataset.removeUrgent);saveUrgent();renderUrgent()})}
function bindMain(){ $$('.lang button').forEach(b=>b.onclick=()=>setLang(b.dataset.lang));$('#menuBtn').onclick=()=>openSheet('menu');$('#closeSheet').onclick=closeSheet;$('#emergencyBtn').onclick=()=>openSheet('urgent');$('#addBtn').onclick=()=>openSheet('add');$('#listBtn').onclick=()=>openSheet('list');$('#filterBtn').onclick=()=>openSheet('filters');$('#locateBtn').onclick=()=>getGPS(true);$('#searchInput').oninput=e=>{query=e.target.value.trim();renderMarkers()};$$('[data-radius]').forEach(b=>b.onclick=()=>{radius=b.dataset.radius;$$('[data-radius]').forEach(x=>x.classList.toggle('active',x===b));if(radius!=='country'&&!currentPos)getGPS(false);renderMarkers()});$$('.navitem').forEach(b=>b.onclick=()=>{const v=b.dataset.view;if(v==='map')closeSheet();else if(v==='list')openSheet('list');else if(v==='profile')openSheet('profile');else if(v==='add')openSheet('add')})}
function init(){loadStore();initMap();bindMain();setLang(lang);renderUrgent();getGPS(false);if('serviceWorker' in navigator && location.protocol.startsWith('https')){const sw=`const CACHE='ustamap-shell-v1';self.addEventListener('install',e=>e.waitUntil(caches.open(CACHE).then(c=>c.addAll([self.location.href]).catch(()=>{}))));self.addEventListener('fetch',e=>{if(e.request.method==='GET'&&new URL(e.request.url).origin===location.origin)e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request)))})`;try{const blob=new Blob([sw],{type:'text/javascript'});navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(()=>{})}catch(e){}}}
document.addEventListener('DOMContentLoaded',init);
})();
</script>
