<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TOKMESH NAVIGATOR - Peşəkar Səsli Naviqator</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- Leaflet Routing Machine CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css" />

  <style>
    :root {
      --bg-dark: #020617;
      --card-bg: rgba(15, 23, 42, 0.95);
      --accent-cyan: #06b6d4;
      --accent-green: #10b981;
      --accent-pink: #ec4899;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --border: rgba(255, 255, 255, 0.12);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; user-select: none; -webkit-tap-highlight-color: transparent; }
    
    body, html { width: 100%; height: 100dvh; background: var(--bg-dark); color: var(--text-main); overflow: hidden; position: fixed; }
    #app { display: flex; flex-direction: column; width: 100vw; height: 100dvh; position: relative; }

    /* Top Navigation Bar (Waze Style) */
    .top-nav-card {
      position: absolute; top: 12px; left: 12px; right: 12px; z-index: 1000;
      background: var(--card-bg); backdrop-filter: blur(16px);
      padding: 12px 16px; border-radius: 18px; border: 1px solid var(--border);
      box-shadow: 0 10px 30px rgba(0,0,0,0.6); display: flex; flex-direction: column; gap: 8px;
    }
    .search-row { display: flex; gap: 8px; }
    .search-input {
      flex: 1; background: rgba(255,255,255,0.06); border: 1px solid var(--border);
      padding: 10px 14px; border-radius: 12px; color: #fff; outline: none; font-size: 0.88rem;
    }
    .btn-action {
      background: var(--accent-cyan); border: none; color: #000; padding: 0 16px;
      border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 0.85rem;
    }

    /* Map Div */
    #map { width: 100%; height: 100%; z-index: 1; }

    /* Bottom Waze-Style Trip Info Panel */
    .trip-panel {
      position: absolute; bottom: 20px; left: 12px; right: 12px; z-index: 1000;
      background: var(--card-bg); backdrop-filter: blur(18px); border: 1px solid var(--border);
      border-radius: 22px; padding: 16px 20px; display: flex; justify-content: space-between; align-items: center;
      box-shadow: 0 10px 40px rgba(0,0,0,0.8);
    }
    .trip-metric { display: flex; flex-direction: column; align-items: center; }
    .metric-value { font-size: 1.4rem; font-weight: 900; color: var(--accent-cyan); }
    .metric-label { font-size: 0.72rem; color: var(--text-sub); text-transform: uppercase; letter-spacing: 0.5px; }
    
    .btn-voice {
      background: rgba(16, 185, 129, 0.15); border: 1px solid var(--accent-green); color: var(--accent-green);
      padding: 10px 14px; border-radius: 14px; font-weight: bold; cursor: pointer; font-size: 0.8rem;
      display: flex; align-items: center; gap: 6px;
    }

    /* Leaflet Routing Machine gizlədilməsi (özəl təmiz dizayn üçün) */
    .leaflet-routing-container { display: none !important; }
  </style>
</head>
<body>

  <div id="app">
    <!-- Top Search Bar -->
    <div class="top-nav-card">
      <div class="search-row">
        <input type="text" id="dest-input" class="search-input" placeholder="Haraya getmək istəyirsən? (məs: Gənclik, Nərimanov)..." />
        <button class="btn-action" onclick="setDestinationBySearch()">Get</button>
      </div>
      <div style="font-size:0.75rem; color:var(--text-sub); display:flex; justify-content:space-between;">
        <span id="nav-status">📍 GPS aktivdir. Məkan gözlənilir...</span>
        <span style="color:var(--accent-green);">● 0 AZN Open-Route</span>
      </div>
    </div>

    <!-- Map Container -->
    <div id="map"></div>

    <!-- Bottom Trip Info Panel -->
    <div class="trip-panel">
      <div class="trip-metric">
        <span class="metric-value" id="trip-time">-- dəq</span>
        <span class="metric-label">Qalan Vaxt</span>
      </div>
      <div class="trip-metric">
        <span class="metric-value" id="trip-dist">-- km</span>
        <span class="metric-label">Məsafə</span>
      </div>
      <button class="btn-voice" onclick="speakInstruction('Naviqasiya aktivdir. Yolunuza davam edin.')">
        🔊 Səs
      </button>
    </div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- Leaflet Routing Machine JS -->
  <script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>

  <script>
    // --- 1. XƏRİTƏNİN İŞƏ SALINMASI (Baku Mərkəz) ---
    const map = L.map('map', { zoomControl: false }).setView([40.4093, 49.8671], 14);

    // Tünd qaranlıq Waze/CartoDB Stili (Tamamilə Pulsuz)
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    let userLat = 40.4093;
    let userLng = 49.8671;
    let routingControl = null;
    let userMarker = null;

    // --- 2. SƏSLİ BİLDİRİŞ MÜHƏRRİKİ (Web Speech API) ---
    function speakInstruction(text) {
      if ('speechSynthesis' in window) {
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'az-AZ'; // Azərbaycan dili dəstəyi
        utterance.rate = 1.0;
        window.speechSynthesis.speak(utterance);
      }
    }

    // --- 3. REAL-TIME GPS İZLƏMƏSİ ---
    if (navigator.geolocation) {
      navigator.geolocation.watchPosition((pos) => {
        userLat = pos.coords.latitude;
        userLng = pos.coords.longitude;

        document.getElementById('nav-status').innerText = `Məkan yeniləndi: ${userLat.toFixed(4)}, ${userLng.toFixed(4)}`;

        if (userMarker) {
          userMarker.setLatLng([userLat, userLng]);
        } else {
          userMarker = L.circleMarker([userLat, userLng], {
            radius: 10,
            fillColor: "#06b6d4",
            color: "#ffffff",
            weight: 3,
            fillOpacity: 1
          }).addTo(map).bindPopup("Sən buradasan").openPopup();
          
          map.setView([userLat, userLng], 15);
        }
      }, (err) => {
        document.getElementById('nav-status').innerText = "GPS xətası: Məkan ala bilmədi.";
      }, { enableHighAccuracy: true });
    }

    // --- 4. TƏYİNAT MƏNTƏQƏSİNƏ MARŞRUT VƏ HESABLAMA (OSRM Routing) ---
    async function setDestinationBySearch() {
      const query = document.getElementById('dest-input').value.trim();
      if (!query) return alert("Zəhmət olmasa ünvan daxil edin!");

      document.getElementById('nav-status').innerText = `'${query}' axtarılır və yol çəkilir...`;

      try {
        const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query + ' Baku')}`);
        const data = await res.json();

        if (data && data.length > 0) {
          const destLat = parseFloat(data[0].lat);
          const destLng = parseFloat(data[0].lon);

          // Əgər əvvəlki marşrut varsa təmizlə
          if (routingControl) {
            map.removeControl(routingControl);
          }

          // Göy rəngli Waze tipli marşrut xətti və real vaxt hesablanması
          routingControl = L.Routing.control({
            waypoints: [
              L.latLng(userLat, userLng),
              L.latLng(destLat, destLng)
            ],
            routeWhileDragging: false,
            addWaypoints: false,
            fitSelectedRoutes: true,
            lineOptions: {
              styles: [{ color: '#06b6d4', opacity: 0.85, weight: 6 }] // Göy Waze zolağı
            },
            createMarker: function(i, wp, nWps) {
              return i === nWps - 1 ? L.marker(wp.latLng).bindPopup("Təyinat nöqtəsi") : null;
            }
          }).addTo(map);

          // Marşrut hesablananda məsafə və vaxtı paneldə göstər
          routingControl.on('routesfound', function(e) {
            const routes = e.routes;
            const summary = routes[0].summary;
            const distKm = (summary.totalDistance / 1000).toFixed(1);
            const timeMin = Math.round(summary.totalTime / 60);

            document.getElementById('trip-dist').innerText = `${distKm} km`;
            document.getElementById('trip-time').innerText = `${timeMin} dəq`;
            document.getElementById('nav-status').innerText = `Marşrut quruldu: ${data[0].display_name.substring(0, 30)}...`;

            // Səsli xəbərdarlıq
            speakInstruction(`Marşrut quruldu. Məsafə ${distKm kilometr}, təxmini vaxt ${timeMin} dəqiqə.`);
          });

        } else {
          alert("Ünvan tapılmadı.");
        }
      } catch (e) {
        alert("Marşrut qurularkən xəta baş verdi.");
      }
    }
  </script>
</body>
</html>
