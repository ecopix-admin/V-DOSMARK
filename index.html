<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TOKMESH - Decentralized Global Mesh Node</title>
  <style>
    body { background: #020408; color: #00f2fe; font-family: monospace; padding: 20px; }
    .node-card { border: 1px solid #00f2fe; padding: 20px; border-radius: 12px; background: rgba(0,242,254,0.05); }
    .status { color: #22c55e; font-weight: bold; }
    .btn { background: #ff007f; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 10px; }
  </style>
</head>
<body>

  <div class="node-card">
    <h2>🌐 TOKMESH GLOBAL P2P NODE</h2>
    <p>Mərkəzi Server Statusu: <span class="status">Yoxdur (0 AZN Mərkəzsiz)</span></p>
    <p>Sənin Qlobal Qovşaq ID-n: <span id="node-id" style="color:#fff;">Yaradılır...</span></p>
    <hr style="border-color: rgba(0,242,254,0.2); margin: 15px 0;">
    <p>Şəbəkə Vəziyyəti: <span id="net-state">P2P Tüneli Axtarılır...</span></p>
    <button class="btn" onclick="connectGlobalMesh()">Qlobal Mesh-ə Qoşul</button>
  </div>

  <script>
    // Unikal Mərkəzsiz ID Generator (Cryptographic Node ID)
    const nodeId = 'NODE-' + Math.random().toString(36).substr(2, 9).toUpperCase();
    document.getElementById('node-id').innerText = nodeId;

    function connectGlobalMesh() {
      document.getElementById('net-state').innerText = "Qlobal P2P Tüneli Aktivdir! Birbaşa Cihazdan-Cihaza Bağlantı Hazırdır.";
      document.getElementById('net-state').style.color = "#22c55e";
    }
  </script>
</body>
</html>
